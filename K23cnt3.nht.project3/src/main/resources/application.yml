server:
  port: 8080
  servlet:
    context-path: /taphoa

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/taphoa_nht?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
    username: root
    password: 123456  # ĐỔI THÀNH PASSWORD MYSQL CỦA BẠN
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate.SQL: DEBUG

spring:
  datasource:
    url: jdbc:h2:mem:taphoa_db
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console