# ============================================
# ?NG D?NG C?A HÀNG T?P HÓA - CONFIGURATION
# ============================================

# ============ APPLICATION ============
spring.application.name=K23cnt3.nht.2310900112
server.port=8080
server.servlet.context-path=/

# ============ ERROR HANDLING ============
server.error.whitelabel.enabled=false
server.error.path=/error

# ============ DATABASE ============
spring.datasource.url=jdbc:mysql://localhost:3306/taphoa_nht?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============ JPA/HIBERNATE ============
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============ THYMELEAF ============
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# ============ FILE UPLOAD ============
# S? D?NG TH? M?C STATIC/IMAGES CÓ S?N
app.file.upload-dir=src/main/resources/static/images/
app.upload.max-size=10MB
app.upload.allowed-extensions=.jpg,.jpeg,.png,.gif

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============ STATIC RESOURCES ============
spring.web.resources.static-locations=classpath:/static/,classpath:/public/,classpath:/resources/,classpath:/META-INF/resources/
spring.web.resources.cache.period=3600

# ============ LOGGING ============
logging.level.root=INFO
logging.level.K23cnt3.nht._2=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# ============ DEVTOOLS ============
spring.devtools.livereload.enabled=true
spring.devtools.restart.enabled=true

# ============ STORE INFO ============
app.store.name=C?a Hàng T?p Hóa NH?T
app.store.address=123 ???ng ABC, Qu?n XYZ, TP.HCM
app.store.phone=028 1234 5678
app.store.email=info@taphoanhat.com