# ============================
# SERVER CONFIGURATION
# ============================
server.port=8080
server.servlet.context-path=/taphoa
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024
server.servlet.multipart.max-file-size=10MB
server.servlet.multipart.max-request-size=10MB
server.servlet.multipart.enabled=true
server.tomcat.relaxed-query-chars=|,{,},[,],^,`,<,>
server.tomcat.relaxed-path-chars=|,{,},[,],^,`,<,>
server.tomcat.uri-encoding=UTF-8
server.max-http-header-size=8192

# ============================
# DATABASE CONFIGURATION
# ============================
spring.datasource.url=jdbc:mysql://localhost:3306/taphoa_nht?useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=22446688
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================
# JPA / HIBERNATE
# ============================
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# ============================
# FILE UPLOAD CONFIGURATION
# ============================
app.file.upload-dir=C:/taphoa-uploads
app.thumbnail.width=300
app.thumbnail.height=300
app.image.max-size=5242880
app.image.allowed-extensions=jpg,jpeg,png,gif,bmp,webp
app.thumbnail.quality=0.9
app.thumbnail.format=jpg
app.base-url=http://localhost:8080/taphoa
app.name=Tap Hoa NHT
app.version=1.0.0
app.default-page-size=20
app.date-format=dd/MM/yyyy
app.datetime-format=dd/MM/yyyy HH:mm:ss

# ============================
# THYMELEAF TEMPLATE
# ============================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.template-resolver-order=1

# ============================
# STATIC RESOURCES
# ============================
spring.web.resources.static-locations=classpath:/static/,file:${app.file.upload-dir}
spring.web.resources.cache.cachecontrol.max-age=86400
spring.web.resources.cache.cachecontrol.no-cache=false
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

# ============================
# LOGGING CONFIGURATION
# ============================
logging.level.root=WARN
logging.level.K23cnt3.nht._2=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.file.name=logs/taphoa-application.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %-5level [%thread] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.max-file-size=10MB

# ============================
# SPRING BOOT SPECIFIC
# ============================
spring.main.banner-mode=off
spring.main.lazy-initialization=false
spring.main.allow-bean-definition-overriding=true
spring.main.web-application-type=servlet

# ============================
# DEVTOOLS (Development only)
# ============================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.additional-paths=src/main/java
spring.devtools.restart.exclude=static/**,public/**,uploads/**

# ============================
# VALIDATION & MVC
# ============================
spring.mvc.hiddenmethod.filter.enabled=true
spring.mvc.format.date=dd/MM/yyyy
spring.mvc.format.date-time=dd/MM/yyyy HH:mm:ss
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
spring.mvc.throw-exception-if-no-handler-found=true
spring.mvc.static-path-pattern=/**

# ============================
# SECURITY (t?m th?i disable)
# ============================
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration