<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml"
      layout:decorate="~{layout/admin-layout}">
<head>
    <title>Sửa thông tin nhà cung cấp</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid px-4">
        <h1 class="mt-4">Sửa thông tin nhà cung cấp</h1>
        <ol class="breadcrumb mb-4">
            <li class="breadcrumb-item"><a th:href="@{/admin}">Dashboard</a></li>
            <li class="breadcrumb-item"><a th:href="@{/admin/nhacungcap}">Nhà cung cấp</a></li>
            <li class="breadcrumb-item active">Sửa: <span th:text="${nhaCungCap.tenNCC}"></span></li>
        </ol>

        <!-- Form sửa thông tin -->
        <div class="card mb-4">
            <div class="card-header bg-warning text-dark">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <i class="fas fa-edit me-1"></i>
                        Sửa thông tin nhà cung cấp #<span th:text="${nhaCungCap.maNCC}"></span>
                    </div>
                    <span th:switch="${nhaCungCap.trangThai}">
                        <span th:case="'DANG_HOP_TAC'" class="badge bg-success">Đang hợp tác</span>
                        <span th:case="'TAM_NGUNG'" class="badge bg-warning">Tạm ngừng</span>
                        <span th:case="'NGUNG_HOP_TAC'" class="badge bg-danger">Ngừng hợp tác</span>
                    </span>
                </div>
            </div>
            <div class="card-body">
                <form th:action="@{/admin/nhacungcap/edit/{id}(id=${nhaCungCap.maNCC})}"
                      method="post">
                    <input type="hidden" name="_method" value="PUT">

                    <!-- Thông tin cơ bản -->
                    <h5 class="mb-3 border-bottom pb-2">Thông tin cơ bản</h5>
                    <div class="row mb-3">
                        <div class="col-md-8">
                            <label for="tenNCC" class="form-label">Tên nhà cung cấp <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="tenNCC" name="tenNCC"
                                   th:value="${nhaCungCap.tenNCC}" required>
                        </div>
                        <div class="col-md-4">
                            <label for="maSoThue" class="form-label">Mã số thuế</label>
                            <input type="text" class="form-control" id="maSoThue" name="maSoThue"
                                   th:value="${nhaCungCap.maSoThue}">
                        </div>
                    </div>

                    <!-- Thông tin liên hệ -->
                    <h5 class="mb-3 border-bottom pb-2">Thông tin liên hệ</h5>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="dienThoai" class="form-label">Điện thoại <span class="text-danger">*</span></label>
                            <input type="tel" class="form-control" id="dienThoai" name="dienThoai"
                                   th:value="${nhaCungCap.dienThoai}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" id="email" name="email"
                                   th:value="${nhaCungCap.email}" required>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-12">
                            <label for="diaChi" class="form-label">Địa chỉ <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="diaChi" name="diaChi" rows="2" required
                                      th:text="${nhaCungCap.diaChi}"></textarea>
                        </div>
                    </div>

                    <!-- Thông tin bổ sung -->
                    <h5 class="mb-3 border-bottom pb-2">Thông tin bổ sung</h5>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="website" class="form-label">Website</label>
                            <input type="url" class="form-control" id="website" name="website"
                                   th:value="${nhaCungCap.website}" placeholder="https://example.com">
                        </div>
                        <div class="col-md-6">
                            <label for="nguoiLienHe" class="form-label">Người liên hệ</label>
                            <input type="text" class="form-control" id="nguoiLienHe" name="nguoiLienHe"
                                   th:value="${nhaCungCap.nguoiLienHe}">
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="chucVuNguoiLienHe" class="form-label">Chức vụ người liên hệ</label>
                            <input type="text" class="form-control" id="chucVuNguoiLienHe" name="chucVuNguoiLienHe"
                                   th:value="${nhaCungCap.chucVuNguoiLienHe}">
                        </div>
                        <div class="col-md-6">
                            <label for="soTaiKhoan" class="form-label">Số tài khoản ngân hàng</label>
                            <input type="text" class="form-control" id="soTaiKhoan" name="soTaiKhoan"
                                   th:value="${nhaCungCap.soTaiKhoan}">
                        </div>
                    </div>

                    <!-- Thông tin hợp tác -->
                    <h5 class="mb-3 border-bottom pb-2">Thông tin hợp tác</h5>
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label for="trangThai" class="form-label">Trạng thái <span class="text-danger">*</span></label>
                            <select class="form-select" id="trangThai" name="trangThai" required>
                                <option value="DANG_HOP_TAC" th:selected="${nhaCungCap.trangThai == 'DANG_HOP_TAC'}">Đang hợp tác</option>
                                <option value="TAM_NGUNG" th:selected="${nhaCungCap.trangThai == 'TAM_NGUNG'}">Tạm ngừng</option>
                                <option value="NGUNG_HOP_TAC" th:selected="${nhaCungCap.trangThai == 'NGUNG_HOP_TAC'}">Ngừng hợp tác</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="diemDanhGia" class="form-label">Điểm đánh giá</label>
                            <select class="form-select" id="diemDanhGia" name="diemDanhGia">
                                <option value="0" th:selected="${nhaCungCap.diemDanhGia == 0}">0 sao</option>
                                <option value="1" th:selected="${nhaCungCap.diemDanhGia == 1}">1 sao</option>
                                <option value="2" th:selected="${nhaCungCap.diemDanhGia == 2}">2 sao</option>
                                <option value="3" th:selected="${nhaCungCap.diemDanhGia == 3}">3 sao</option>
                                <option value="4" th:selected="${nhaCungCap.diemDanhGia == 4}">4 sao</option>
                                <option value="5" th:selected="${nhaCungCap.diemDanhGia == 5}">5 sao</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="thoiGianGiaoHang" class="form-label">Thời gian giao hàng</label>
                            <select class="form-select" id="thoiGianGiaoHang" name="thoiGianGiaoHang">
                                <option value="">-- Chọn --</option>
                                <option value="TRONG_24H" th:selected="${nhaCungCap.thoiGianGiaoHang == 'TRONG_24H'}">Trong 24 giờ</option>
                                <option value="TRONG_48H" th:selected="${nhaCungCap.thoiGianGiaoHang == 'TRONG_48H'}">Trong 48 giờ</option>
                                <option value="TRONG_3_7_NGAY" th:selected="${nhaCungCap.thoiGianGiaoHang == 'TRONG_3_7_NGAY'}">3-7 ngày</option>
                                <option value="TREN_7_NGAY" th:selected="${nhaCungCap.thoiGianGiaoHang == 'TREN_7_NGAY'}">Trên 7 ngày</option>
                            </select>
                        </div>
                    </div>

                    <!-- Thống kê (chỉ hiển thị) -->
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <div class="card bg-light">
                                <div class="card-body py-2">
                                    <div class="text-center">
                                        <div class="text-primary fw-bold" th:text="${tongSanPham}">0</div>
                                        <small class="text-muted">Sản phẩm</small>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card bg-light">
                                <div class="card-body py-2">
                                    <div class="text-center">
                                        <div class="text-success fw-bold" th:text="${tongDonHang}">0</div>
                                        <small class="text-muted">Đơn hàng</small>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card bg-light">
                                <div class="card-body py-2">
                                    <div class="text-center">
                                        <div class="text-info fw-bold" th:text="${#temporals.format(nhaCungCap.ngayTao, 'dd/MM/yyyy')}">01/01/2024</div>
                                        <small class="text-muted">Ngày tham gia</small>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Ghi chú -->
                    <div class="mb-4">
                        <label for="ghiChu" class="form-label">Ghi chú</label>
                        <textarea class="form-control" id="ghiChu" name="ghiChu" rows="3"
                                  th:text="${nhaCungCap.ghiChu}"></textarea>
                    </div>

                    <!-- Nút submit -->
                    <div class="d-flex justify-content-between">
                        <a th:href="@{/admin/nhacungcap}" class="btn btn-secondary">
                            <i class="fas fa-times me-1"></i> Hủy
                        </a>
                        <div>
                            <button type="button" class="btn btn-info me-2"
                                    onclick="xemChiTiet(${nhaCungCap.maNCC})">
                                <i class="fas fa-eye me-1"></i> Xem chi tiết
                            </button>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i> Cập nhật
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Script -->
<th:block layout:fragment="scripts">
    <script>
        function xemChiTiet(maNCC) {
            window.location.href = `/admin/nhacungcap/detail/\${maNCC}`;
        }
    </script>
</th:block>
</body>
</html>
