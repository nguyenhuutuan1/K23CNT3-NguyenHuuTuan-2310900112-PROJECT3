<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml"
      layout:decorate="~{layout/admin-layout}">
<head>
    <title>Thêm nhà cung cấp mới</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid px-4">
        <h1 class="mt-4">Thêm nhà cung cấp mới</h1>
        <ol class="breadcrumb mb-4">
            <li class="breadcrumb-item"><a th:href="@{/admin}">Dashboard</a></li>
            <li class="breadcrumb-item"><a th:href="@{/admin/nhacungcap}">Nhà cung cấp</a></li>
            <li class="breadcrumb-item active">Thêm mới</li>
        </ol>

        <!-- Form thêm NCC -->
        <div class="card mb-4">
            <div class="card-header bg-primary text-white">
                <i class="fas fa-truck-loading me-1"></i>
                Thông tin nhà cung cấp mới
            </div>
            <div class="card-body">
                <form th:action="@{/admin/nhacungcap/create}" method="post">
                    <!-- Thông tin cơ bản -->
                    <h5 class="mb-3 border-bottom pb-2">Thông tin cơ bản</h5>
                    <div class="row mb-3">
                        <div class="col-md-8">
                            <label for="tenNCC" class="form-label">Tên nhà cung cấp <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="tenNCC" name="tenNCC"
                                   th:value="${nhaCungCap != null ? nhaCungCap.tenNCC : ''}" required>
                            <div class="form-text">Tên đầy đủ của công ty/nhà cung cấp</div>
                        </div>
                        <div class="col-md-4">
                            <label for="maSoThue" class="form-label">Mã số thuế</label>
                            <input type="text" class="form-control" id="maSoThue" name="maSoThue"
                                   th:value="${nhaCungCap != null ? nhaCungCap.maSoThue : ''}">
                        </div>
                    </div>

                    <!-- Thông tin liên hệ -->
                    <h5 class="mb-3 border-bottom pb-2">Thông tin liên hệ</h5>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="dienThoai" class="form-label">Điện thoại <span class="text-danger">*</span></label>
                            <input type="tel" class="form-control" id="dienThoai" name="dienThoai"
                                   th:value="${nhaCungCap != null ? nhaCungCap.dienThoai : ''}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" id="email" name="email"
                                   th:value="${nhaCungCap != null ? nhaCungCap.email : ''}" required>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-12">
                            <label for="diaChi" class="form-label">Địa chỉ <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="diaChi" name="diaChi" rows="2" required
                                      th:text="${nhaCungCap != null ? nhaCungCap.diaChi : ''}"></textarea>
                        </div>
                    </div>

                    <!-- Thông tin bổ sung -->
                    <h5 class="mb-3 border-bottom pb-2">Thông tin bổ sung</h5>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="website" class="form-label">Website</label>
                            <input type="url" class="form-control" id="website" name="website"
                                   th:value="${nhaCungCap != null ? nhaCungCap.website : ''}"
                                   placeholder="https://example.com">
                        </div>
                        <div class="col-md-6">
                            <label for="nguoiLienHe" class="form-label">Người liên hệ</label>
                            <input type="text" class="form-control" id="nguoiLienHe" name="nguoiLienHe"
                                   th:value="${nhaCungCap != null ? nhaCungCap.nguoiLienHe : ''}">
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="chucVuNguoiLienHe" class="form-label">Chức vụ người liên hệ</label>
                            <input type="text" class="form-control" id="chucVuNguoiLienHe" name="chucVuNguoiLienHe"
                                   th:value="${nhaCungCap != null ? nhaCungCap.chucVuNguoiLienHe : ''}">
                        </div>
                        <div class="col-md-6">
                            <label for="soTaiKhoan" class="form-label">Số tài khoản ngân hàng</label>
                            <input type="text" class="form-control" id="soTaiKhoan" name="soTaiKhoan"
                                   th:value="${nhaCungCap != null ? nhaCungCap.soTaiKhoan : ''}">
                        </div>
                    </div>

                    <!-- Loại hàng cung cấp -->
                    <div class="row mb-3">
                        <div class="col-md-12">
                            <label class="form-label">Loại hàng cung cấp chính</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="loai1" name="loaiHang" value="THUC_PHAM_KHO">
                                <label class="form-check-label" for="loai1">Thực phẩm khô</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="loai2" name="loaiHang" value="DO_HOP">
                                <label class="form-check-label" for="loai2">Đồ hộp</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="loai3" name="loaiHang" value="GIA_VI">
                                <label class="form-check-label" for="loai3">Gia vị</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="loai4" name="loaiHang" value="BANH_KEO">
                                <label class="form-check-label" for="loai4">Bánh kẹo</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="loai5" name="loaiHang" value="DO_UONG">
                                <label class="form-check-label" for="loai5">Đồ uống</label>
                            </div>
                        </div>
                    </div>

                    <!-- Thời gian giao hàng và điều khoản -->
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label for="thoiGianGiaoHang" class="form-label">Thời gian giao hàng ước tính</label>
                            <select class="form-select" id="thoiGianGiaoHang" name="thoiGianGiaoHang">
                                <option value="">-- Chọn --</option>
                                <option value="TRONG_24H">Trong 24 giờ</option>
                                <option value="TRONG_48H">Trong 48 giờ</option>
                                <option value="TRONG_3_7_NGAY">3-7 ngày</option>
                                <option value="TREN_7_NGAY">Trên 7 ngày</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="trangThai" class="form-label">Trạng thái</label>
                            <select class="form-select" id="trangThai" name="trangThai">
                                <option value="DANG_HOP_TAC" selected>Đang hợp tác</option>
                                <option value="TAM_NGUNG">Tạm ngừng</option>
                            </select>
                        </div>
                    </div>

                    <!-- Ghi chú -->
                    <div class="mb-4">
                        <label for="ghiChu" class="form-label">Ghi chú</label>
                        <textarea class="form-control" id="ghiChu" name="ghiChu" rows="3"
                                  th:text="${nhaCungCap != null ? nhaCungCap.ghiChu : ''}"></textarea>
                        <div class="form-text">Ghi chú về nhà cung cấp, điều khoản đặc biệt, v.v.</div>
                    </div>

                    <!-- Nút submit -->
                    <div class="d-flex justify-content-between">
                        <a th:href="@{/admin/nhacungcap}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left me-1"></i> Quay lại
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-1"></i> Thêm nhà cung cấp
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
