<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml"
      layout:decorate="~{layout/admin-layout}">
<head>
    <title>Thêm sản phẩm mới</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid px-4">
        <h1 class="mt-4">Thêm sản phẩm mới</h1>
        <ol class="breadcrumb mb-4">
            <li class="breadcrumb-item"><a th:href="@{/admin}">Dashboard</a></li>
            <li class="breadcrumb-item"><a th:href="@{/admin/sanpham}">Sản phẩm</a></li>
            <li class="breadcrumb-item active">Thêm mới</li>
        </ol>

        <!-- Form thêm sản phẩm -->
        <div class="card mb-4">
            <div class="card-header">
                <i class="fas fa-plus-circle me-1"></i>
                Thông tin sản phẩm
            </div>
            <div class="card-body">
                <form th:action="@{/admin/sanpham/create}" method="post" enctype="multipart/form-data">
                    <!-- Tên sản phẩm -->
                    <div class="mb-3">
                        <label for="tenSP" class="form-label">Tên sản phẩm <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="tenSP" name="tenSP" required
                               th:value="${sanPham != null ? sanPham.tenSP : ''}">
                        <div class="form-text">Tên sản phẩm không được để trống</div>
                    </div>

                    <!-- Loại và NCC -->
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="maLoai" class="form-label">Loại sản phẩm <span class="text-danger">*</span></label>
                            <select class="form-select" id="maLoai" name="maLoai" required>
                                <option value="">-- Chọn loại --</option>
                                <option th:each="loai : ${loaiSanPhamList}"
                                        th:value="${loai.maLoai}"
                                        th:text="${loai.tenLoai}"
                                        th:selected="${sanPham != null && sanPham.loaiSanPham.maLoai == loai.maLoai}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="maNCC" class="form-label">Nhà cung cấp <span class="text-danger">*</span></label>
                            <select class="form-select" id="maNCC" name="maNCC" required>
                                <option value="">-- Chọn NCC --</option>
                                <option th:each="ncc : ${nhaCungCapList}"
                                        th:value="${ncc.maNCC}"
                                        th:text="${ncc.tenNCC}"
                                        th:selected="${sanPham != null && sanPham.nhaCungCap.maNCC == ncc.maNCC}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <!-- Giá và số lượng -->
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label for="donGia" class="form-label">Đơn giá (VNĐ) <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="donGia" name="donGia" required
                                   min="0" step="1000"
                                   th:value="${sanPham != null ? sanPham.donGia : ''}">
                        </div>
                        <div class="col-md-4">
                            <label for="soLuong" class="form-label">Số lượng <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="soLuong" name="soLuong" required
                                   min="0"
                                   th:value="${sanPham != null ? sanPham.soLuong : ''}">
                        </div>
                        <div class="col-md-4">
                            <label for="donViTinh" class="form-label">Đơn vị tính</label>
                            <select class="form-select" id="donViTinh" name="donViTinh">
                                <option value="Cái" th:selected="${sanPham != null && sanPham.donViTinh == 'Cái'}">Cái</option>
                                <option value="Kg" th:selected="${sanPham != null && sanPham.donViTinh == 'Kg'}">Kg</option>
                                <option value="Gói" th:selected="${sanPham != null && sanPham.donViTinh == 'Gói'}">Gói</option>
                                <option value="Hộp" th:selected="${sanPham != null && sanPham.donViTinh == 'Hộp'}">Hộp</option>
                                <option value="Chai" th:selected="${sanPham != null && sanPham.donViTinh == 'Chai'}">Chai</option>
                                <option value="Thùng" th:selected="${sanPham != null && sanPham.donViTinh == 'Thùng'}">Thùng</option>
                            </select>
                        </div>
                    </div>

                    <!-- Hình ảnh -->
                    <div class="mb-3">
                        <label for="hinhAnh" class="form-label">Hình ảnh sản phẩm</label>
                        <input type="file" class="form-control" id="hinhAnh" name="hinhAnh"
                               accept="image/*">
                        <div class="form-text">Chấp nhận: JPG, PNG, GIF. Tối đa 5MB</div>
                        <div th:if="${sanPham != null && sanPham.hinhAnh}">
                            <img th:src="@{'/uploads/' + ${sanPham.hinhAnh}}"
                                 alt="Current image" class="img-thumbnail mt-2" width="150">
                        </div>
                    </div>

                    <!-- Mô tả -->
                    <div class="mb-3">
                        <label for="moTa" class="form-label">Mô tả sản phẩm</label>
                        <textarea class="form-control" id="moTa" name="moTa" rows="4"
                                  th:text="${sanPham != null ? sanPham.moTa : ''}"></textarea>
                    </div>

                    <!-- Nút submit -->
                    <div class="d-flex justify-content-between">
                        <a th:href="@{/admin/sanpham}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left me-1"></i> Quay lại
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-1"></i> Lưu sản phẩm
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
