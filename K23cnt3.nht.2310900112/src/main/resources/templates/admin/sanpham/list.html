<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml"
      layout:decorate="~{layout/admin-layout}">
<head>
    <title>Quản lý sản phẩm</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid px-4">
        <h1 class="mt-4">Quản lý sản phẩm</h1>
        <ol class="breadcrumb mb-4">
            <li class="breadcrumb-item"><a th:href="@{/admin}">Dashboard</a></li>
            <li class="breadcrumb-item active">Sản phẩm</li>
        </ol>

        <!-- Thông báo -->
        <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
            <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Thanh công cụ -->
        <div class="card mb-4">
            <div class="card-header">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <i class="fas fa-table me-1"></i>
                        Danh sách sản phẩm
                    </div>
                    <a th:href="@{/admin/sanpham/create}" class="btn btn-primary">
                        <i class="fas fa-plus me-1"></i> Thêm sản phẩm mới
                    </a>
                </div>
            </div>
            <div class="card-body">
                <!-- Bộ lọc -->
                <div class="row mb-3">
                    <div class="col-md-3">
                        <input type="text" class="form-control" id="searchInput" placeholder="Tìm kiếm...">
                    </div>
                    <div class="col-md-2">
                        <select class="form-select" id="categoryFilter">
                            <option value="">Tất cả loại</option>
                            <option th:each="loai : ${loaiSanPhamList}"
                                    th:value="${loai.maLoai}"
                                    th:text="${loai.tenLoai}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-outline-secondary" onclick="filterProducts()">
                            <i class="fas fa-filter"></i> Lọc
                        </button>
                    </div>
                </div>

                <!-- Bảng sản phẩm -->
                <div class="table-responsive">
                    <table class="table table-bordered table-hover" id="productTable">
                        <thead class="table-dark">
                        <tr>
                            <th>Mã SP</th>
                            <th>Hình ảnh</th>
                            <th>Tên sản phẩm</th>
                            <th>Loại</th>
                            <th>Đơn giá</th>
                            <th>Số lượng</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="sp : ${sanPhamList}">
                            <td th:text="${sp.maSP}">1</td>
                            <td>
                                <img th:if="${sp.hinhAnh}"
                                     th:src="@{'/uploads/' + ${sp.hinhAnh}}"
                                     alt="Hình ảnh" class="img-thumbnail" width="60">
                                <img th:unless="${sp.hinhAnh}"
                                     th:src="@{/images/default-product.png}"
                                     alt="Không có ảnh" class="img-thumbnail" width="60">
                            </td>
                            <td>
                                <a th:href="@{/admin/sanpham/detail/{id}(id=${sp.maSP})}"
                                   th:text="${sp.tenSP}">Gạo Jasmine 5kg</a>
                            </td>
                            <td th:text="${sp.loaiSanPham.tenLoai}">Thực phẩm khô</td>
                            <td th:text="${#numbers.formatDecimal(sp.donGia, 0, 'COMMA', 0, 'POINT')}">150.000</td>
                            <td>
                                <span th:class="${sp.soLuong > 10 ? 'text-success' : 'text-danger'}"
                                      th:text="${sp.soLuong}">100</span>
                            </td>
                            <td>
                                <span th:if="${sp.soLuong > 0}" class="badge bg-success">Còn hàng</span>
                                <span th:if="${sp.soLuong == 0}" class="badge bg-danger">Hết hàng</span>
                            </td>
                            <td>
                                <div class="btn-group" role="group">
                                    <a th:href="@{/admin/sanpham/edit/{id}(id=${sp.maSP})}"
                                       class="btn btn-sm btn-warning">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <button type="button" class="btn btn-sm btn-danger"
                                            onclick="confirmDelete(${sp.maSP})">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Phân trang -->
                <nav th:if="${totalPages > 1}">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:classappend="${currentPage == 1 ? 'disabled' : ''}">
                            <a class="page-link" th:href="@{/admin/sanpham(page=${currentPage-1})}">Trước</a>
                        </li>
                        <li th:each="i : ${#numbers.sequence(1, totalPages)}"
                            class="page-item" th:classappend="${i == currentPage ? 'active' : ''}">
                            <a class="page-link" th:href="@{/admin/sanpham(page=${i})}" th:text="${i}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage == totalPages ? 'disabled' : ''}">
                            <a class="page-link" th:href="@{/admin/sanpham(page=${currentPage+1})}">Sau</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>

<!-- Modal xác nhận xóa -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Xác nhận xóa</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>Bạn có chắc chắn muốn xóa sản phẩm này?</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                <form id="deleteForm" method="post">
                    <input type="hidden" name="_method" value="DELETE">
                    <button type="submit" class="btn btn-danger">Xóa</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Script cho trang list -->
<th:block layout:fragment="scripts">
    <script>
        function filterProducts() {
            const search = document.getElementById('searchInput').value;
            const category = document.getElementById('categoryFilter').value;
            window.location.href = `/admin/sanpham?search=\${search}&category=\${category}`;
        }

        function confirmDelete(productId) {
            const deleteForm = document.getElementById('deleteForm');
            deleteForm.action = `/admin/sanpham/\${productId}/delete`;
            new bootstrap.Modal(document.getElementById('deleteModal')).show();
        }

        // Tìm kiếm khi nhấn Enter
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                filterProducts();
            }
        });
    </script>
</th:block>
</body>
</html>
