<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml"
      layout:decorate="~{layout/admin-layout}">
<head>
    <title>Chỉnh sửa sản phẩm</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid px-4">
        <h1 class="mt-4">Chỉnh sửa sản phẩm</h1>
        <ol class="breadcrumb mb-4">
            <li class="breadcrumb-item"><a th:href="@{/admin}">Dashboard</a></li>
            <li class="breadcrumb-item"><a th:href="@{/admin/sanpham}">Sản phẩm</a></li>
            <li class="breadcrumb-item active">Chỉnh sửa</li>
        </ol>

        <!-- Form chỉnh sửa -->
        <div class="card mb-4">
            <div class="card-header">
                <i class="fas fa-edit me-1"></i>
                Chỉnh sửa thông tin sản phẩm
            </div>
            <div class="card-body">
                <form th:action="@{/admin/sanpham/edit/{id}(id=${sanPham.maSP})}"
                      method="post" enctype="multipart/form-data">
                    <input type="hidden" name="_method" value="PUT">

                    <!-- Hiển thị thông tin hiện tại -->
                    <div class="alert alert-info mb-3">
                        <strong>Mã sản phẩm:</strong> <span th:text="${sanPham.maSP}"></span> |
                        <strong>Ngày tạo:</strong> <span th:text="${#dates.format(sanPham.ngayTao, 'dd/MM/yyyy')}"></span>
                    </div>

                    <!-- Các trường tương tự create.html nhưng có giá trị mặc định -->
                    <div class="mb-3">
                        <label for="tenSP" class="form-label">Tên sản phẩm <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="tenSP" name="tenSP"
                               th:value="${sanPham.tenSP}" required>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="maLoai" class="form-label">Loại sản phẩm <span class="text-danger">*</span></label>
                            <select class="form-select" id="maLoai" name="maLoai" required>
                                <option th:each="loai : ${loaiSanPhamList}"
                                        th:value="${loai.maLoai}"
                                        th:text="${loai.tenLoai}"
                                        th:selected="${sanPham.loaiSanPham.maLoai == loai.maLoai}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="maNCC" class="form-label">Nhà cung cấp <span class="text-danger">*</span></label>
                            <select class="form-select" id="maNCC" name="maNCC" required>
                                <option th:each="ncc : ${nhaCungCapList}"
                                        th:value="${ncc.maNCC}"
                                        th:text="${ncc.tenNCC}"
                                        th:selected="${sanPham.nhaCungCap.maNCC == ncc.maNCC}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label for="donGia" class="form-label">Đơn giá (VNĐ) <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="donGia" name="donGia"
                                   th:value="${sanPham.donGia}" required min="0" step="1000">
                        </div>
                        <div class="col-md-4">
                            <label for="soLuong" class="form-label">Số lượng <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="soLuong" name="soLuong"
                                   th:value="${sanPham.soLuong}" required min="0">
                        </div>
                        <div class="col-md-4">
                            <label for="donViTinh" class="form-label">Đơn vị tính</label>
                            <input type="text" class="form-control" id="donViTinh" name="donViTinh"
                                   th:value="${sanPham.donViTinh}">
                        </div>
                    </div>

                    <!-- Hình ảnh hiện tại -->
                    <div class="mb-3">
                        <label class="form-label">Hình ảnh hiện tại</label>
                        <div th:if="${sanPham.hinhAnh}">
                            <img th:src="@{'/uploads/' + ${sanPham.hinhAnh}}"
                                 alt="Current image" class="img-thumbnail me-2" width="150">
                            <div class="form-check mt-2">
                                <input class="form-check-input" type="checkbox" id="removeImage" name="removeImage">
                                <label class="form-check-label text-danger" for="removeImage">
                                    Xóa hình ảnh này
                                </label>
                            </div>
                        </div>
                        <div th:unless="${sanPham.hinhAnh}" class="text-muted">
                            Không có hình ảnh
                        </div>
                    </div>

                    <!-- Tải lên hình ảnh mới -->
                    <div class="mb-3">
                        <label for="newImage" class="form-label">Hình ảnh mới (nếu thay đổi)</label>
                        <input type="file" class="form-control" id="newImage" name="newImage" accept="image/*">
                        <div class="form-text">Để trống nếu giữ nguyên ảnh cũ</div>
                    </div>

                    <div class="mb-3">
                        <label for="moTa" class="form-label">Mô tả sản phẩm</label>
                        <textarea class="form-control" id="moTa" name="moTa" rows="4"
                                  th:text="${sanPham.moTa}"></textarea>
                    </div>

                    <!-- Nút submit -->
                    <div class="d-flex justify-content-between">
                        <a th:href="@{/admin/sanpham}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left me-1"></i> Hủy
                        </a>
                        <div>
                            <a th:href="@{/admin/sanpham/detail/{id}(id=${sanPham.maSP})}"
                               class="btn btn-info me-2">
                                <i class="fas fa-eye me-1"></i> Xem chi tiết
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i> Cập nhật
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
