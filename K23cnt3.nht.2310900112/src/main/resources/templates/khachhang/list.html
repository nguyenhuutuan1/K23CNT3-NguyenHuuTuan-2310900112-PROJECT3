<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Danh sách khách hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 th:text="${title}">Danh sách khách hàng</h2>
        <a href="/khachhang/add" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Thêm khách hàng</a>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <form th:action="@{/khachhang/search}" method="get" class="row">
                <div class="col-md-10">
                    <input type="text" name="keyword" class="form-control" placeholder="Nhập tên khách hàng...">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100"><i class="bi bi-search"></i> Tìm kiếm</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>Mã KH</th><th>Họ tên</th><th>Ngày sinh</th><th>Giới tính</th><th>Điện thoại</th><th>Email</th><th>Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="kh : ${khachhangList}">
                        <td th:text="${kh.maKH}"></td>
                        <td th:text="${kh.hoTen}"></td>
                        <td th:text="${kh.ngaySinh}"></td>
                        <td th:text="${kh.gioiTinh}"></td>
                        <td th:text="${kh.dienThoai}"></td>
                        <td th:text="${kh.email}"></td>
                        <td>
                            <a th:href="@{/khachhang/{id}(id=${kh.maKH})}" class="btn btn-sm btn-info"><i class="bi bi-eye"></i></a>
                            <a th:href="@{/khachhang/edit/{id}(id=${kh.maKH})}" class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></a>
                            <a th:href="@{/khachhang/delete/{id}(id=${kh.maKH})}" class="btn btn-sm btn-danger" onclick="return confirm('Xóa khách hàng này?')"><i class="bi bi-trash"></i></a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
