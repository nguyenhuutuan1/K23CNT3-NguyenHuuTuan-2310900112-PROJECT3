<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Chi tiết khách hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 th:text="${title}">Chi tiết khách hàng</h2>

    <div class="card">
        <div class="card-body">
            <div class="row">
                <div class="col-md-8">
                    <h4 th:text="${khachhang.hoTen}">Họ tên khách hàng</h4>

                    <table class="table table-borderless">
                        <tr>
                            <th width="150">Mã KH:</th>
                            <td th:text="${khachhang.maKH}"></td>
                        </tr>
                        <tr>
                            <th>Ngày sinh:</th>
                            <td th:text="${khachhang.ngaySinh}"></td>
                        </tr>
                        <tr>
                            <th>Giới tính:</th>
                            <td th:text="${khachhang.gioiTinh}"></td>
                        </tr>
                        <tr>
                            <th>Địa chỉ:</th>
                            <td th:text="${khachhang.diaChi}"></td>
                        </tr>
                        <tr>
                            <th>Điện thoại:</th>
                            <td th:text="${khachhang.dienThoai}"></td>
                        </tr>
                        <tr>
                            <th>Email:</th>
                            <td th:text="${khachhang.email}"></td>
                        </tr>
                    </table>
                </div>

                <div class="col-md-4">
                    <div class="card">
                        <div class="card-header bg-light">
                            <h6 class="mb-0">Thao tác</h6>
                        </div>
                        <div class="card-body">
                            <div class="d-grid gap-2">
                                <a th:href="@{/khachhang/edit/{id}(id=${khachhang.maKH})}" class="btn btn-warning">
                                    <i class="bi bi-pencil"></i> Chỉnh sửa
                                </a>
                                <a th:href="@{/hoadon/create}" class="btn btn-primary">
                                    <i class="bi bi-receipt"></i> Tạo hóa đơn
                                </a>
                                <a href="/khachhang" class="btn btn-secondary">
                                    <i class="bi bi-arrow-left"></i> Quay lại
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
