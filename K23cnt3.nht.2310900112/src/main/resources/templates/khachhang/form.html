<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Form khách hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 th:text="${title}">Form khách hàng</h2>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/khachhang/save}" th:object="${khachhang}" method="post">
                <input type="hidden" th:field="*{maKH}">

                <div class="mb-3">
                    <label class="form-label">Họ tên *</label>
                    <input type="text" th:field="*{hoTen}" class="form-control" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Ngày sinh</label>
                        <input type="date" th:field="*{ngaySinh}" class="form-control">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Giới tính</label>
                        <select th:field="*{gioiTinh}" class="form-select">
                            <option value="">-- Chọn giới tính --</option>
                            <option value="Nam">Nam</option>
                            <option value="Nữ">Nữ</option>
                            <option value="Khác">Khác</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Địa chỉ</label>
                    <input type="text" th:field="*{diaChi}" class="form-control">
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Điện thoại</label>
                        <input type="text" th:field="*{dienThoai}" class="form-control">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" th:field="*{email}" class="form-control">
                    </div>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="/khachhang" class="btn btn-secondary">Quay lại</a>
                    <button type="submit" class="btn btn-primary">Lưu khách hàng</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
