<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml"
      layout:decorate="~{layout/client-layout}">
<head>
    <title>Đăng nhập tài khoản</title>

    <th:block layout:fragment="styles">
        <style>
            .login-container {
                min-height: 600px;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 40px 0;
            }
            .login-card {
                max-width: 450px;
                width: 100%;
                border: none;
                border-radius: 15px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            }
            .login-header {
                background: linear-gradient(135deg, #28a745, #20c997);
                color: white;
                border-radius: 15px 15px 0 0;
                padding: 30px;
                text-align: center;
            }
            .login-header i {
                font-size: 3rem;
                margin-bottom: 15px;
            }
            .login-body {
                padding: 40px;
            }
            .form-control {
                padding: 12px 15px;
                border-radius: 8px;
                border: 1px solid #dee2e6;
                transition: all 0.3s;
            }
            .form-control:focus {
                border-color: #28a745;
                box-shadow: 0 0 0 0.25rem rgba(40, 167, 69, 0.25);
            }
            .login-btn {
                padding: 12px;
                font-weight: 600;
                border-radius: 8px;
                transition: all 0.3s;
            }
            .social-login {
                display: flex;
                gap: 15px;
                margin-top: 20px;
            }
            .social-btn {
                flex: 1;
                padding: 12px;
                border-radius: 8px;
                border: 1px solid #dee2e6;
                background: white;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                transition: all 0.3s;
            }
            .social-btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            }
            .divider {
                display: flex;
                align-items: center;
                margin: 25px 0;
                color: #6c757d;
            }
            .divider::before,
            .divider::after {
                content: "";
                flex: 1;
                border-bottom: 1px solid #dee2e6;
            }
            .divider-text {
                padding: 0 15px;
                font-size: 0.9rem;
            }
            .forgot-password {
                color: #6c757d;
                text-decoration: none;
                font-size: 0.9rem;
            }
            .forgot-password:hover {
                color: #28a745;
            }
            .register-link {
                text-align: center;
                margin-top: 25px;
                padding-top: 25px;
                border-top: 1px solid #dee2e6;
            }
            .remember-me {
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .error-message {
                color: #dc3545;
                font-size: 0.875rem;
                margin-top: 0.25rem;
            }
            .alert-box {
                border-radius: 8px;
                padding: 15px;
                margin-bottom: 20px;
            }
        </style>
    </th:block>
</head>
<body>

<div layout:fragment="content">
    <div class="login-container">
        <div class="card login-card">
            <!-- Login Header -->
            <div class="login-header">
                <i class="fas fa-user-circle"></i>
                <h2 class="mb-2">Chào mừng trở lại</h2>
                <p class="mb-0">Đăng nhập để tiếp tục mua sắm</p>
            </div>

            <!-- Login Body -->
            <div class="login-body">
                <!-- Error/Success Messages -->
                <div th:if="${error}" class="alert alert-danger alert-box" role="alert">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    <span th:text="${error}">Tên đăng nhập hoặc mật khẩu không đúng</span>
                </div>

                <div th:if="${message}" class="alert alert-success alert-box" role="alert">
                    <i class="fas fa-check-circle me-2"></i>
                    <span th:text="${message}">Đăng ký thành công! Vui lòng đăng nhập.</span>
                </div>

                <div th:if="${logout}" class="alert alert-info alert-box" role="alert">
                    <i class="fas fa-info-circle me-2"></i>
                    Bạn đã đăng xuất thành công.
                </div>

                <!-- Login Form -->
                <form th:action="@{/login}" method="post" id="loginForm">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <!-- Email/Username -->
                    <div class="mb-3">
                        <label for="username" class="form-label">Email hoặc số điện thoại</label>
                        <input type="text" class="form-control" id="username" name="username"
                               th:value="${username != null ? username : ''}"
                               placeholder="Nhập email hoặc số điện thoại" required>
                        <div class="error-message" id="usernameError"></div>
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <label for="password" class="form-label">Mật khẩu</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="password" name="password"
                                   placeholder="Nhập mật khẩu" required>
                            <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="error-message" id="passwordError"></div>
                    </div>

                    <!-- Remember Me & Forgot Password -->
                    <div class="mb-4 remember-me">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe" name="remember-me">
                            <label class="form-check-label" for="rememberMe">
                                Ghi nhớ đăng nhập
                            </label>
                        </div>
                        <a th:href="@{/forgot-password}" class="forgot-password">
                            Quên mật khẩu?
                        </a>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-success login-btn w-100">
                        <i class="fas fa-sign-in-alt me-2"></i>Đăng nhập
                    </button>

                    <!-- Social Login Divider -->
                    <div class="divider">
                        <span class="divider-text">Hoặc đăng nhập với</span>
                    </div>

                    <!-- Social Login Buttons -->
                    <div class="social-login">
                        <button type="button" class="social-btn" onclick="socialLogin('facebook')">
                            <i class="fab fa-facebook-f text-primary"></i>
                            <span>Facebook</span>
                        </button>
                        <button type="button" class="social-btn" onclick="socialLogin('google')">
                            <i class="fab fa-google text-danger"></i>
                            <span>Google</span>
                        </button>
                        <button type="button" class="social-btn" onclick="socialLogin('zalo')">
                            <i class="fab fa-facebook-messenger text-info"></i>
                            <span>Zalo</span>
                        </button>
                    </div>

                    <!-- Register Link -->
                    <div class="register-link">
                        <p class="mb-2">Chưa có tài khoản?</p>
                        <a th:href="@{/register}" class="btn btn-outline-success">
                            <i class="fas fa-user-plus me-2"></i>Đăng ký ngay
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
    <script>
        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        // Form validation
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            let isValid = true;

            // Clear previous errors
            document.querySelectorAll('.error-message').forEach(el => {
                el.textContent = '';
            });

            // Validate username
            if (!username) {
                document.getElementById('usernameError').textContent = 'Vui lòng nhập email hoặc số điện thoại';
                isValid = false;
            }

            // Validate password
            if (!password) {
                document.getElementById('passwordError').textContent = 'Vui lòng nhập mật khẩu';
                isValid = false;
            } else if (password.length < 6) {
                document.getElementById('passwordError').textContent = 'Mật khẩu phải có ít nhất 6 ký tự';
                isValid = false;
            }

            if (!isValid) {
                e.preventDefault();
            }
        });

        // Social login
        function socialLogin(provider) {
            const url = `/oauth2/authorization/${provider}`;
            window.location.href = url;
        }

        // Auto-focus on username field
        document.addEventListener('DOMContentLoaded', function() {
            const usernameInput = document.getElementById('username');
            if (usernameInput) {
                usernameInput.focus();
            }
        });

        // Enter key submits form
        document.getElementById('username').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });

        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</th:block>

</body>
</html>
