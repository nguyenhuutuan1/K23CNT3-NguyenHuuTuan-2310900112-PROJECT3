<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml"
      layout:decorate="~{layout/client-layout}">
<head>
    <title>Đăng ký tài khoản</title>

    <th:block layout:fragment="styles">
        <style>
            .register-container {
                min-height: 700px;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 40px 0;
            }
            .register-card {
                max-width: 550px;
                width: 100%;
                border: none;
                border-radius: 15px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            }
            .register-header {
                background: linear-gradient(135deg, #28a745, #20c997);
                color: white;
                border-radius: 15px 15px 0 0;
                padding: 30px;
                text-align: center;
            }
            .register-header i {
                font-size: 3rem;
                margin-bottom: 15px;
            }
            .register-body {
                padding: 40px;
            }
            .form-control {
                padding: 12px 15px;
                border-radius: 8px;
                border: 1px solid #dee2e6;
                transition: all 0.3s;
            }
            .form-control:focus {
                border-color: #28a745;
                box-shadow: 0 0 0 0.25rem rgba(40, 167, 69, 0.25);
            }
            .register-btn {
                padding: 12px;
                font-weight: 600;
                border-radius: 8px;
                transition: all 0.3s;
            }
            .password-strength {
                height: 5px;
                border-radius: 3px;
                margin-top: 5px;
                background: #e9ecef;
                overflow: hidden;
            }
            .password-strength-bar {
                height: 100%;
                width: 0%;
                transition: width 0.3s;
            }
            .strength-weak {
                background: #dc3545;
            }
            .strength-fair {
                background: #ffc107;
            }
            .strength-good {
                background: #28a745;
            }
            .strength-strong {
                background: #20c997;
            }
            .password-hints {
                font-size: 0.8rem;
                color: #6c757d;
                margin-top: 5px;
            }
            .hint-valid {
                color: #28a745;
            }
            .hint-invalid {
                color: #dc3545;
            }
            .terms-check {
                font-size: 0.9rem;
            }
            .login-link {
                text-align: center;
                margin-top: 25px;
                padding-top: 25px;
                border-top: 1px solid #dee2e6;
            }
            .step-indicator {
                display: flex;
                justify-content: space-between;
                margin-bottom: 30px;
                position: relative;
            }
            .step-indicator::before {
                content: '';
                position: absolute;
                top: 15px;
                left: 0;
                right: 0;
                height: 2px;
                background: #dee2e6;
                z-index: 1;
            }
            .step {
                display: flex;
                flex-direction: column;
                align-items: center;
                position: relative;
                z-index: 2;
            }
            .step-circle {
                width: 30px;
                height: 30px;
                border-radius: 50%;
                background: #e9ecef;
                color: #6c757d;
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: bold;
                margin-bottom: 8px;
            }
            .step.active .step-circle {
                background: #28a745;
                color: white;
            }
            .step.completed .step-circle {
                background: #20c997;
                color: white;
            }
            .step-text {
                font-size: 0.8rem;
                color: #6c757d;
                text-align: center;
            }
            .step.active .step-text {
                color: #28a745;
                font-weight: bold;
            }
            .form-step {
                display: none;
            }
            .form-step.active {
                display: block;
            }
            .btn-group-step {
                display: flex;
                justify-content: space-between;
                margin-top: 30px;
            }
        </style>
    </th:block>
</head>
<body>

<div layout:fragment="content">
    <div class="register-container">
        <div class="card register-card">
            <!-- Register Header -->
            <div class="register-header">
                <i class="fas fa-user-plus"></i>
                <h2 class="mb-2">Tạo tài khoản mới</h2>
                <p class="mb-0">Đăng ký để nhận nhiều ưu đãi đặc biệt</p>
            </div>

            <!-- Register Body -->
            <div class="register-body">
                <!-- Step Indicator -->
                <div class="step-indicator">
                    <div class="step active" id="step1">
                        <div class="step-circle">1</div>
                        <div class="step-text">Thông tin cá nhân</div>
                    </div>
                    <div class="step" id="step2">
                        <div class="step-circle">2</div>
                        <div class="step-text">Tài khoản & Mật khẩu</div>
                    </div>
                    <div class="step" id="step3">
                        <div class="step-circle">3</div>
                        <div class="step-text">Xác nhận</div>
                    </div>
                </div>

                <!-- Error/Success Messages -->
                <div th:if="${error}" class="alert alert-danger alert-box" role="alert">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    <span th:text="${error}">Có lỗi xảy ra. Vui lòng thử lại.</span>
                </div>

                <!-- Registration Form -->
                <form th:action="@{/register}" method="post" id="registerForm">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <!-- Step 1: Personal Information -->
                    <div class="form-step active" id="formStep1">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="firstName" class="form-label">Họ</label>
                                <input type="text" class="form-control" id="firstName" name="firstName"
                                       th:value="${user != null ? user.firstName : ''}"
                                       placeholder="Nhập họ của bạn" required>
                                <div class="error-message" id="firstNameError"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="lastName" class="form-label">Tên</label>
                                <input type="text" class="form-control" id="lastName" name="lastName"
                                       th:value="${user != null ? user.lastName : ''}"
                                       placeholder="Nhập tên của bạn" required>
                                <div class="error-message" id="lastNameError"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label">Số điện thoại</label>
                            <input type="tel" class="form-control" id="phone" name="phone"
                                   th:value="${user != null ? user.phone : ''}"
                                   placeholder="Nhập số điện thoại" required>
                            <div class="error-message" id="phoneError"></div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email"
                                   th:value="${user != null ? user.email : ''}"
                                   placeholder="Nhập địa chỉ email" required>
                            <div class="error-message" id="emailError"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Ngày sinh</label>
                            <div class="row">
                                <div class="col-4">
                                    <select class="form-select" id="birthDay" name="birthDay">
                                        <option value="">Ngày</option>
                                        <option th:each="day : ${#numbers.sequence(1, 31)}"
                                                th:value="${day}" th:text="${day}">1</option>
                                    </select>
                                </div>
                                <div class="col-4">
                                    <select class="form-select" id="birthMonth" name="birthMonth">
                                        <option value="">Tháng</option>
                                        <option th:each="month : ${#numbers.sequence(1, 12)}"
                                                th:value="${month}" th:text="${month}">1</option>
                                    </select>
                                </div>
                                <div class="col-4">
                                    <select class="form-select" id="birthYear" name="birthYear">
                                        <option value="">Năm</option>
                                        <option th:each="year : ${#numbers.sequence(1900, 2023)}"
                                                th:value="${year}" th:text="${year}">1990</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Giới tính</label>
                            <div class="d-flex gap-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="gender" id="male" value="MALE">
                                    <label class="form-check-label" for="male">Nam</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="gender" id="female" value="FEMALE">
                                    <label class="form-check-label" for="female">Nữ</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="gender" id="other" value="OTHER">
                                    <label class="form-check-label" for="other">Khác</label>
                                </div>
                            </div>
                        </div>

                        <div class="btn-group-step">
                            <div></div> <!-- Empty div for spacing -->
                            <button type="button" class="btn btn-success" onclick="nextStep(2)">
                                Tiếp theo <i class="fas fa-arrow-right ms-1"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Step 2: Account & Password -->
                    <div class="form-step" id="formStep2">
                        <div class="mb-3">
                            <label for="username" class="form-label">Tên đăng nhập</label>
                            <input type="text" class="form-control" id="username" name="username"
                                   th:value="${user != null ? user.username : ''}"
                                   placeholder="Nhập tên đăng nhập" required>
                            <div class="error-message" id="usernameError"></div>
                            <small class="text-muted">Tên đăng nhập phải có ít nhất 4 ký tự</small>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Mật khẩu</label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="password" name="password"
                                       placeholder="Nhập mật khẩu" required>
                                <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                            <div class="password-strength">
                                <div class="password-strength-bar" id="passwordStrengthBar"></div>
                            </div>
                            <div class="password-hints">
                                <div id="lengthHint" class="hint-invalid">Ít nhất 8 ký tự</div>
                                <div id="uppercaseHint" class="hint-invalid">Có chữ in hoa</div>
                                <div id="lowercaseHint" class="hint-invalid">Có chữ thường</div>
                                <div id="numberHint" class="hint-invalid">Có số</div>
                                <div id="specialHint" class="hint-invalid">Có ký tự đặc biệt</div>
                            </div>
                            <div class="error-message" id="passwordError"></div>
                        </div>

                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Xác nhận mật khẩu</label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="confirmPassword"
                                       placeholder="Nhập lại mật khẩu" required>
                                <button class="btn btn-outline-secondary" type="button" id="toggleConfirmPassword">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                            <div class="error-message" id="confirmPasswordError"></div>
                        </div>

                        <div class="mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="terms" required>
                                <label class="form-check-label terms-check" for="terms">
                                    Tôi đồng ý với
                                    <a th:href="@{/terms}" target="_blank">Điều khoản sử dụng</a>
                                    và
                                    <a th:href="@{/privacy}" target="_blank">Chính sách bảo mật</a>
                                </label>
                                <div class="error-message" id="termsError"></div>
                            </div>

                            <div class="form-check mt-2">
                                <input class="form-check-input" type="checkbox" id="newsletter" name="subscribeNewsletter">
                                <label class="form-check-label terms-check" for="newsletter">
                                    Đăng ký nhận thông tin khuyến mãi qua email
                                </label>
                            </div>
                        </div>

                        <div class="btn-group-step">
                            <button type="button" class="btn btn-outline-secondary" onclick="prevStep(1)">
                                <i class="fas fa-arrow-left me-1"></i>Quay lại
                            </button>
                            <button type="submit" class="btn btn-success register-btn">
                                <i class="fas fa-user-plus me-2"></i>Đăng ký ngay
                            </button>
                        </div>
                    </div>
                </form>

                <!-- Login Link -->
                <div class="login-link">
                    <p class="mb-2">Đã có tài khoản?</p>
                    <a th:href="@{/login}" class="btn btn-outline-success">
                        <i class="fas fa-sign-in-alt me-2"></i>Đăng nhập ngay
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
    <script>
        let currentStep = 1;

        // Next step
        function nextStep(next) {
            if (!validateStep(currentStep)) {
                return;
            }

            document.getElementById('formStep' + currentStep).classList.remove('active');
            document.getElementById('step' + currentStep).classList.remove('active');

            currentStep = next;

            document.getElementById('formStep' + currentStep).classList.add('active');
            document.getElementById('step' + currentStep).classList.add('active');
            document.getElementById('step' + (currentStep - 1)).classList.add('completed');
        }

        // Previous step
        function prevStep(prev) {
            document.getElementById('formStep' + currentStep).classList.remove('active');
            document.getElementById('step' + currentStep).classList.remove('active');

            currentStep = prev;

            document.getElementById('formStep' + currentStep).classList.add('active');
            document.getElementById('step' + currentStep).classList.add('active');
            document.getElementById('step' + currentStep).classList.remove('completed');
        }

        // Validate step
        function validateStep(step) {
            let isValid = true;

            // Clear previous errors
            document.querySelectorAll('.error-message').forEach(el => {
                el.textContent = '';
            });

            if (step === 1) {
                // Validate personal information
                const firstName = document.getElementById('firstName').value.trim();
                const lastName = document.getElementById('lastName').value.trim();
                const phone = document.getElementById('phone').value.trim();
                const email = document.getElementById('email').value.trim();

                if (!firstName) {
                    document.getElementById('firstNameError').textContent = 'Vui lòng nhập họ';
                    isValid = false;
                }

                if (!lastName) {
                    document.getElementById('lastNameError').textContent = 'Vui lòng nhập tên';
                    isValid = false;
                }

                if (!phone) {
                    document.getElementById('phoneError').textContent = 'Vui lòng nhập số điện thoại';
                    isValid = false;
                } else if (!/^(0[3|5|7|8|9])+([0-9]{8})$/.test(phone)) {
                    document.getElementById('phoneError').textContent = 'Số điện thoại không hợp lệ';
                    isValid = false;
                }

                if (!email) {
                    document.getElementById('emailError').textContent = 'Vui lòng nhập email';
                    isValid = false;
                } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    document.getElementById('emailError').textContent = 'Email không hợp lệ';
                    isValid = false;
                }
            }

            return isValid;
        }

        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        document.getElementById('toggleConfirmPassword').addEventListener('click', function() {
            const confirmInput = document.getElementById('confirmPassword');
            const icon = this.querySelector('i');

            if (confirmInput.type === 'password') {
                confirmInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                confirmInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        // Password strength checker
        document.getElementById('password').addEventListener('input', function() {
            const password = this.value;
            const strengthBar = document.getElementById('passwordStrengthBar');
            const hints = {
                length: document.getElementById('lengthHint'),
                uppercase: document.getElementById('uppercaseHint'),
                lowercase: document.getElementById('lowercaseHint'),
                number: document.getElementById('numberHint'),
                special: document.getElementById('specialHint')
            };

            let strength = 0;
            let totalCriteria = 5;
            let passedCriteria = 0;

            // Check length
            if (password.length >= 8) {
                strength += 20;
                hints.length.classList.remove('hint-invalid');
                hints.length.classList.add('hint-valid');
                passedCriteria++;
            } else {
                hints.length.classList.remove('hint-valid');
                hints.length.classList.add('hint-invalid');
            }

            // Check uppercase
            if (/[A-Z]/.test(password)) {
                strength += 20;
                hints.uppercase.classList.remove('hint-invalid');
                hints.uppercase.classList.add('hint-valid');
                passedCriteria++;
            } else {
                hints.uppercase.classList.remove('hint-valid');
                hints.uppercase.classList.add('hint-invalid');
            }

            // Check lowercase
            if (/[a-z]/.test(password)) {
                strength += 20;
                hints.lowercase.classList.remove('hint-invalid');
                hints.lowercase.classList.add('hint-valid');
                passedCriteria++;
            } else {
                hints.lowercase.classList.remove('hint-valid');
                hints.lowercase.classList.add('hint-invalid');
            }

            // Check number
            if (/[0-9]/.test(password)) {
                strength += 20;
                hints.number.classList.remove('hint-invalid');
                hints.number.classList.add('hint-valid');
                passedCriteria++;
            } else {
                hints.number.classList.remove('hint-valid');
                hints.number.classList.add('hint-invalid');
            }

            // Check special character
            if (/[^A-Za-z0-9]/.test(password)) {
                strength += 20;
                hints.special.classList.remove('hint-invalid');
                hints.special.classList.add('hint-valid');
                passedCriteria++;
            } else {
                hints.special.classList.remove('hint-valid');
                hints.special.classList.add('hint-invalid');
            }

            // Update strength bar
            strengthBar.style.width = strength + '%';

            // Update color based on passed criteria
            if (passedCriteria <= 2) {
                strengthBar.className = 'password-strength-bar strength-weak';
            } else if (passedCriteria === 3) {
                strengthBar.className = 'password-strength-bar strength-fair';
            } else if (passedCriteria === 4) {
                strengthBar.className = 'password-strength-bar strength-good';
            } else if (passedCriteria === 5) {
                strengthBar.className = 'password-strength-bar strength-strong';
            }
        });

        // Form validation on submit
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            if (!validateStep(2)) {
                e.preventDefault();
                nextStep(2); // Go to step 2 to show errors
                return;
            }

            // Validate step 2
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const confirmPassword = document.getElementById('confirmPassword').value.trim();
            const terms = document.getElementById('terms').checked;
            let isValid = true;

            // Clear previous errors
            document.querySelectorAll('.error-message').forEach(el => {
                el.textContent = '';
            });

            // Validate username
            if (!username) {
                document.getElementById('usernameError').textContent = 'Vui lòng nhập tên đăng nhập';
                isValid = false;
            } else if (username.length < 4) {
                document.getElementById('usernameError').textContent = 'Tên đăng nhập phải có ít nhất 4 ký tự';
                isValid = false;
            }

            // Validate password
            if (!password) {
                document.getElementById('passwordError').textContent = 'Vui lòng nhập mật khẩu';
                isValid = false;
            } else if (password.length < 8) {
                document.getElementById('passwordError').textContent = 'Mật khẩu phải có ít nhất 8 ký tự';
                isValid = false;
            }

            // Validate confirm password
            if (!confirmPassword) {
                document.getElementById('confirmPasswordError').textContent = 'Vui lòng xác nhận mật khẩu';
                isValid = false;
            } else if (password !== confirmPassword) {
                document.getElementById('confirmPasswordError').textContent = 'Mật khẩu xác nhận không khớp';
                isValid = false;
            }

            // Validate terms
            if (!terms) {
                document.getElementById('termsError').textContent = 'Vui lòng đồng ý với điều khoản sử dụng';
                isValid = false;
            }

            if (!isValid) {
                e.preventDefault();
            }
        });

        // Check username availability (would need AJAX call in real app)
        document.getElementById('username').addEventListener('blur', function() {
            const username = this.value.trim();
            if (username.length >= 4) {
                // Here you would make an AJAX call to check if username is available
                console.log('Checking username availability:', username);
            }
        });

        // Check email availability (would need AJAX call in real app)
        document.getElementById('email').addEventListener('blur', function() {
            const email = this.value.trim();
            if (email && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                // Here you would make an AJAX call to check if email is available
                console.log('Checking email availability:', email);
            }
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('firstName').focus();
        });
    </script>
</th:block>

</body>
</html>
