<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Không tìm thấy trang - 404</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            max-width: 600px;
        }
        .error-code {
            font-size: 120px;
            font-weight: bold;
            color: #ff6b6b;
            line-height: 1;
        }
        .error-message {
            font-size: 28px;
            margin: 20px 0;
            color: #333;
        }
        .error-description {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
        }
        .back-button {
            padding: 12px 40px;
            font-size: 18px;
            border-radius: 50px;
        }
        .search-box {
            margin: 30px 0;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-message">Trang không tồn tại</h1>
        <p class="error-description">
            Trang bạn đang tìm kiếm có thể đã bị xóa, đổi tên hoặc tạm thời không khả dụng.
        </p>

        <!-- Search box -->
        <div class="search-box">
            <div class="input-group mb-3">
                <input type="text" class="form-control form-control-lg" placeholder="Tìm kiếm trên trang web...">
                <button class="btn btn-primary" type="button">
                    <i class="bi bi-search"></i> Tìm kiếm
                </button>
            </div>
        </div>

        <div class="mt-4">
            <a th:href="@{/}" class="btn btn-primary back-button">
                <i class="bi bi-house-door"></i> Về trang chủ
            </a>
            <button onclick="history.back()" class="btn btn-outline-primary back-button ms-2">
                <i class="bi bi-arrow-left"></i> Quay lại trang trước
            </button>
        </div>

        <div class="mt-5">
            <p class="text-muted">
                Nếu bạn tin rằng đây là lỗi, vui lòng liên hệ với quản trị viên.
            </p>
        </div>
    </div>
</div>

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
