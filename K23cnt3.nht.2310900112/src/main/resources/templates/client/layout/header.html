<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="header">
    <!-- Top Bar -->
    <div class="top-bar bg-success text-white py-2">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <i class="fas fa-phone-alt"></i> Hotline: 1900 1234 |
                    <i class="fas fa-envelope ms-3"></i> cskh@webtaphoa.vn
                </div>
                <div class="col-md-6 text-end">
                    <a href="/dang-nhap" class="text-white text-decoration-none">
                        <i class="fas fa-user"></i> Đăng nhập
                    </a>
                    <span class="mx-2">|</span>
                    <a href="/dang-ky" class="text-white text-decoration-none">
                        <i class="fas fa-user-plus"></i> Đăng ký
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Header -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <!-- Logo -->
            <a class="navbar-brand" href="/">
                <img th:src="@{/images/logo.png}" alt="WebTạpHóa" height="50">
                <span class="fw-bold text-success">WebTạpHóa.vn</span>
            </a>

            <!-- Search -->
            <div class="col-md-5">
                <form th:action="@{/tim-kiem}" method="get" class="d-flex">
                    <input type="text" class="form-control rounded-0"
                           name="q" placeholder="Tìm kiếm sản phẩm...">
                    <button class="btn btn-success rounded-0" type="submit">
                        <i class="fas fa-search"></i>
                    </button>
                </form>
            </div>

            <!-- Cart & User -->
            <div class="col-md-3 text-end">
                <a href="/cart" class="btn btn-outline-success position-relative">
                    <i class="fas fa-shopping-cart"></i> Giỏ hàng
                    <span th:if="${#ctx.session.get('cartCount') != null}"
                          class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                        <span th:text="${#ctx.session.get('cartCount')}"></span>
                    </span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Category Navigation -->
    <div class="category-nav bg-light py-2 border-top">
        <div class="container">
            <div class="row">
                <div class="col-md-3">
                    <div class="dropdown">
                        <button class="btn btn-success w-100 text-start" type="button"
                                data-bs-toggle="dropdown">
                            <i class="fas fa-bars me-2"></i> DANH MỤC SẢN PHẨM
                        </button>
                        <ul class="dropdown-menu w-100">
                            <li th:each="loai : ${danhMuc}">
                                <a class="dropdown-item"
                                   th:href="@{/danh-muc/{maLoai}(maLoai=${loai.maLoai})}">
                                    <i th:class="'fas ' + ${loai.icon} + ' me-2'"></i>
                                    <span th:text="${loai.tenLoai}"></span>
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
                <div class="col-md-9">
                    <nav class="nav">
                        <a class="nav-link text-dark" href="/">
                            <i class="fas fa-home"></i> Trang chủ
                        </a>
                        <a class="nav-link text-dark" href="/san-pham-noi-bat">
                            <i class="fas fa-star"></i> Sản phẩm nổi bật
                        </a>
                        <a class="nav-link text-dark" href="/khuyen-mai">
                            <i class="fas fa-percentage"></i> Khuyến mãi
                        </a>
                        <a class="nav-link text-dark" href="/gioi-thieu">
                            <i class="fas fa-info-circle"></i> Giới thiệu
                        </a>
                        <a class="nav-link text-dark" href="/lien-he">
                            <i class="fas fa-phone-alt"></i> Liên hệ
                        </a>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</div>
</html>
