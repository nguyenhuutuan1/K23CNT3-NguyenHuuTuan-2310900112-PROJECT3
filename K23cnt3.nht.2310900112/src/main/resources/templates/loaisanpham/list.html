<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Danh sách loại sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 th:text="${title}">Danh sách loại sản phẩm</h2>
        <a href="/loaisanpham/add" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Thêm loại sản phẩm</a>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                    <tr><th>Mã loại</th><th>Tên loại</th><th>Thao tác</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="loai : ${loaisanphamList}">
                        <td th:text="${loai.maLoai}"></td>
                        <td th:text="${loai.tenLoai}"></td>
                        <td>
                            <a th:href="@{/loaisanpham/{id}(id=${loai.maLoai})}" class="btn btn-sm btn-info"><i class="bi bi-eye"></i></a>
                            <a th:href="@{/loaisanpham/edit/{id}(id=${loai.maLoai})}" class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></a>
                            <a th:href="@{/loaisanpham/delete/{id}(id=${loai.maLoai})}" class="btn btn-sm btn-danger" onclick="return confirm('Xóa loại sản phẩm này?')"><i class="bi bi-trash"></i></a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
