<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Form loại sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 th:text="${title}">Form loại sản phẩm</h2>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/loaisanpham/save}" th:object="${loaisanpham}" method="post">
                <input type="hidden" th:field="*{maLoai}">

                <div class="mb-3">
                    <label class="form-label">Tên loại sản phẩm *</label>
                    <input type="text" th:field="*{tenLoai}" class="form-control" placeholder="Ví dụ: Thực phẩm khô, Đồ hộp, Gia vị..." required>
                    <small class="text-muted">Nhập tên loại sản phẩm (bắt buộc)</small>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="/loaisanpham" class="btn btn-secondary">Quay lại</a>
                    <button type="submit" class="btn btn-primary">Lưu loại sản phẩm</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
