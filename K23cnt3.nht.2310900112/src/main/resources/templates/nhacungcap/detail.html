<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Chi tiết nhà cung cấp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 th:text="${title}">Chi tiết nhà cung cấp</h2>

    <div class="card">
        <div class="card-body">
            <div class="row">
                <div class="col-md-8">
                    <h4 th:text="${nhacungcap.tenNCC}">Tên nhà cung cấp</h4>

                    <table class="table table-borderless">
                        <tr>
                            <th width="150">Mã NCC:</th>
                            <td th:text="${nhacungcap.maNCC}"></td>
                        </tr>
                        <tr>
                            <th>Địa chỉ:</th>
                            <td th:text="${nhacungcap.diaChi}"></td>
                        </tr>
                        <tr>
                            <th>Điện thoại:</th>
                            <td th:text="${nhacungcap.dienThoai}"></td>
                        </tr>
                        <tr>
                            <th>Email:</th>
                            <td th:text="${nhacungcap.email}"></td>
                        </tr>
                        <tr>
                            <th>Số sản phẩm:</th>
                            <td>
                                <span class="badge bg-info" th:text="${sanphamCount != null ? sanphamCount : 'Đang tải...'}"></span>
                            </td>
                        </tr>
                    </table>
                </div>

                <div class="col-md-4">
                    <div class="card">
                        <div class="card-header bg-light">
                            <h6 class="mb-0">Thao tác</h6>
                        </div>
                        <div class="card-body">
                            <div class="d-grid gap-2">
                                <a th:href="@{/nhacungcap/edit/{id}(id=${nhacungcap.maNCC})}" class="btn btn-warning">
                                    <i class="bi bi-pencil"></i> Chỉnh sửa
                                </a>
                                <a th:href="@{/sanpham}" class="btn btn-info">
                                    <i class="bi bi-box"></i> Xem sản phẩm
                                </a>
                                <a href="/nhacungcap" class="btn btn-secondary">
                                    <i class="bi bi-arrow-left"></i> Quay lại
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
