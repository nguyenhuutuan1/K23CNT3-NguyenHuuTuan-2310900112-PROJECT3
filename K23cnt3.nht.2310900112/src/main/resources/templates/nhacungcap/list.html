<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Danh sách nhà cung cấp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 th:text="${title}">Danh sách nhà cung cấp</h2>
        <a href="/nhacungcap/add" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Thêm nhà cung cấp</a>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>Mã NCC</th><th>Tên NCC</th><th>Địa chỉ</th><th>Điện thoại</th><th>Email</th><th>Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="ncc : ${nhacungcapList}">
                        <td th:text="${ncc.maNCC}"></td>
                        <td th:text="${ncc.tenNCC}"></td>
                        <td th:text="${ncc.diaChi}"></td>
                        <td th:text="${ncc.dienThoai}"></td>
                        <td th:text="${ncc.email}"></td>
                        <td>
                            <a th:href="@{/nhacungcap/{id}(id=${ncc.maNCC})}" class="btn btn-sm btn-info"><i class="bi bi-eye"></i></a>
                            <a th:href="@{/nhacungcap/edit/{id}(id=${ncc.maNCC})}" class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></a>
                            <a th:href="@{/nhacungcap/delete/{id}(id=${ncc.maNCC})}" class="btn btn-sm btn-danger" onclick="return confirm('Xóa nhà cung cấp này?')"><i class="bi bi-trash"></i></a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
