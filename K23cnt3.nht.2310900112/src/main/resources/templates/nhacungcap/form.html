<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Form nhà cung cấp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 th:text="${title}">Form nhà cung cấp</h2>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/nhacungcap/save}" th:object="${nhacungcap}" method="post">
                <input type="hidden" th:field="*{maNCC}">

                <div class="mb-3">
                    <label class="form-label">Tên nhà cung cấp *</label>
                    <input type="text" th:field="*{tenNCC}" class="form-control" placeholder="Ví dụ: Công ty TNHH Thực phẩm ABC" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Địa chỉ</label>
                    <input type="text" th:field="*{diaChi}" class="form-control" placeholder="Ví dụ: 123 Lê Lợi, Quận 1, TP.HCM">
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Điện thoại</label>
                        <input type="text" th:field="*{dienThoai}" class="form-control" placeholder="Ví dụ: 02838234567">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" th:field="*{email}" class="form-control" placeholder="Ví dụ: contact@abcfood.com.vn">
                    </div>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="/nhacungcap" class="btn btn-secondary">Quay lại</a>
                    <button type="submit" class="btn btn-primary">Lưu nhà cung cấp</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
