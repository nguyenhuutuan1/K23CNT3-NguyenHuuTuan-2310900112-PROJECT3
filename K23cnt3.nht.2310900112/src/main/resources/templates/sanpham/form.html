<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Form sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 th:text="${title}">Form sản phẩm</h2>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/sanpham/save}" th:object="${sanpham}" method="post" enctype="multipart/form-data">
                <input type="hidden" th:field="*{maSP}">

                <div class="mb-3">
                    <label class="form-label">Tên sản phẩm *</label>
                    <input type="text" th:field="*{tenSP}" class="form-control" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Loại sản phẩm</label>
                        <select th:field="*{loaiSanPham}" class="form-select">
                            <option value="">-- Chọn loại --</option>
                            <option th:each="loai : ${loaiList}" th:value="${loai.maLoai}" th:text="${loai.tenLoai}"></option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nhà cung cấp</label>
                        <select th:field="*{nhaCungCap}" class="form-select">
                            <option value="">-- Chọn NCC --</option>
                            <option th:each="ncc : ${nccList}" th:value="${ncc.maNCC}" th:text="${ncc.tenNCC}"></option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Đơn vị tính</label>
                        <input type="text" th:field="*{donViTinh}" class="form-control">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Đơn giá *</label>
                        <input type="number" th:field="*{donGia}" class="form-control" min="0" step="1000" required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Số lượng *</label>
                        <input type="number" th:field="*{soLuong}" class="form-control" min="0" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Hình ảnh</label>
                    <input type="file" name="imageFile" class="form-control" accept="image/*">
                    <small class="text-muted">Chọn ảnh sản phẩm (nếu có)</small>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mô tả</label>
                    <textarea th:field="*{moTa}" class="form-control" rows="3"></textarea>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="/sanpham" class="btn btn-secondary">Quay lại</a>
                    <button type="submit" class="btn btn-primary">Lưu sản phẩm</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
