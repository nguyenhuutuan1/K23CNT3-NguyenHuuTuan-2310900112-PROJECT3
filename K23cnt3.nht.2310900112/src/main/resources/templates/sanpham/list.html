<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Danh sách sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 th:text="${title}">Danh sách sản phẩm</h2>
        <div>
            <a href="/sanpham/add" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Thêm sản phẩm</a>
            <a href="/sanpham/conhang" class="btn btn-success"><i class="bi bi-check-circle"></i> Sản phẩm còn hàng</a>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <form th:action="@{/sanpham/search}" method="get" class="row">
                <div class="col-md-10">
                    <input type="text" name="keyword" class="form-control" placeholder="Nhập tên sản phẩm để tìm kiếm...">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100"><i class="bi bi-search"></i> Tìm kiếm</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>Mã SP</th><th>Tên sản phẩm</th><th>Loại</th><th>Đơn vị</th><th>Đơn giá</th><th>Số lượng</th><th>Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="sp : ${sanphamList}">
                        <td th:text="${sp.maSP}"></td>
                        <td th:text="${sp.tenSP}"></td>
                        <td th:text="${sp.loaiSanPham.tenLoai}"></td>
                        <td th:text="${sp.donViTinh}"></td>
                        <td th:text="${#numbers.formatCurrency(sp.donGia)}"></td>
                        <td>
                            <span th:class="${sp.soLuong > 10 ? 'badge bg-success' : sp.soLuong > 0 ? 'badge bg-warning' : 'badge bg-danger'}" th:text="${sp.soLuong}"></span>
                        </td>
                        <td>
                            <a th:href="@{/sanpham/{id}(id=${sp.maSP})}" class="btn btn-sm btn-info"><i class="bi bi-eye"></i></a>
                            <a th:href="@{/sanpham/edit/{id}(id=${sp.maSP})}" class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></a>
                            <a th:href="@{/sanpham/delete/{id}(id=${sp.maSP})}" class="btn btn-sm btn-danger" onclick="return confirm('Xóa sản phẩm này?')"><i class="bi bi-trash"></i></a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
