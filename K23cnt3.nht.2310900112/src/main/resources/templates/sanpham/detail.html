<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Chi tiết sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
</head>
<body>
<div class="container mt-4">
    <h2 th:text="${title}">Chi tiết sản phẩm</h2>

    <div class="card">
        <div class="card-body">
            <div class="row">
                <div class="col-md-8">
                    <h4 th:text="${sanpham.tenSP}">Tên sản phẩm</h4>

                    <table class="table table-borderless">
                        <tr>
                            <th width="150">Mã sản phẩm:</th>
                            <td th:text="${sanpham.maSP}"></td>
                        </tr>
                        <tr>
                            <th>Loại sản phẩm:</th>
                            <td th:text="${sanpham.loaiSanPham.tenLoai}"></td>
                        </tr>
                        <tr>
                            <th>Nhà cung cấp:</th>
                            <td th:text="${sanpham.nhaCungCap.tenNCC}"></td>
                        </tr>
                        <tr>
                            <th>Đơn vị tính:</th>
                            <td th:text="${sanpham.donViTinh}"></td>
                        </tr>
                        <tr>
                            <th>Đơn giá:</th>
                            <td th:text="${#numbers.formatCurrency(sanpham.donGia)}" class="text-danger fw-bold"></td>
                        </tr>
                        <tr>
                            <th>Số lượng tồn:</th>
                            <td>
                                <span th:if="${sanpham.soLuong > 10}" class="badge bg-success" th:text="${sanpham.soLuong} + ' ' + ${sanpham.donViTinh}"></span>
                                <span th:if="${sanpham.soLuong > 0 && sanpham.soLuong <= 10}" class="badge bg-warning" th:text="${sanpham.soLuong} + ' ' + ${sanpham.donViTinh}"></span>
                                <span th:if="${sanpham.soLuong <= 0}" class="badge bg-danger" th:text="'Hết hàng'"></span>
                            </td>
                        </tr>
                        <tr>
                            <th>Hình ảnh:</th>
                            <td>
                                <div th:if="${sanpham.hinhAnh}" class="mt-2">
                                    <img th:src="${sanpham.hinhAnh}" alt="Hình sản phẩm" style="max-width: 200px;" class="img-thumbnail">
                                </div>
                                <div th:unless="${sanpham.hinhAnh}" class="text-muted">
                                    <i>Chưa có hình ảnh</i>
                                </div>
                            </td>
                        </tr>
                    </table>
                </div>

                <div class="col-md-4">
                    <div class="card">
                        <div class="card-header bg-light">
                            <h6 class="mb-0">Thao tác</h6>
                        </div>
                        <div class="card-body">
                            <div class="d-grid gap-2">
                                <a th:href="@{/sanpham/edit/{id}(id=${sanpham.maSP})}" class="btn btn-warning">
                                    <i class="bi bi-pencil"></i> Chỉnh sửa
                                </a>
                                <a th:href="@{/hoadon/create}" class="btn btn-success">
                                    <i class="bi bi-cart-plus"></i> Thêm vào hóa đơn
                                </a>
                                <a href="/sanpham" class="btn btn-secondary">
                                    <i class="bi bi-arrow-left"></i> Quay lại
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-4">
                <h5>Mô tả sản phẩm</h5>
                <div class="card">
                    <div class="card-body">
                        <p th:text="${sanpham.moTa ?: 'Chưa có mô tả chi tiết'}" class="mb-0"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
