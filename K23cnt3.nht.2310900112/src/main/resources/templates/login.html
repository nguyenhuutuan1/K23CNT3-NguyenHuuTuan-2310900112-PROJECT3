<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Đăng nhập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .login-container { max-width: 400px; margin: 100px auto; }
        .login-card { border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
<div class="container">
    <div class="login-container">
        <div class="card login-card">
            <div class="card-header text-center bg-primary text-white">
                <h4><i class="bi bi-shop"></i> CỬA HÀNG TẠP HÓA NHT</h4>
                <p class="mb-0">Hệ thống quản lý</p>
            </div>

            <div class="card-body">
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <h5 class="card-title text-center mb-4">Đăng nhập hệ thống</h5>

                <form action="#" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">Tên đăng nhập</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Nhập tên đăng nhập" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Mật khẩu</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Nhập mật khẩu" required>
                        </div>
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="remember">
                        <label class="form-check-label" for="remember">Ghi nhớ đăng nhập</label>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-box-arrow-in-right"></i> Đăng nhập
                        </button>
                        <a href="/" class="btn btn-outline-secondary">
                            <i class="bi bi-house"></i> Về trang chủ
                        </a>
                    </div>
                </form>

                <hr class="my-4">

                <div class="text-center">
                    <p class="text-muted mb-1">Thông tin đăng nhập mẫu</p>
                    <p class="small text-muted mb-0">
                        <strong>Username:</strong> admin<br>
                        <strong>Password:</strong> admin123
                    </p>
                    <p class="small text-muted mt-2">(Chức năng đăng nhập thực tế sẽ được tích hợp sau)</p>
                </div>
            </div>

            <div class="card-footer text-center text-muted">
                <small>Nguyễn Hữu Tuấn - K23CNT3 - 2310900112</small>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Demo login (không có backend)
    document.querySelector('form').addEventListener('submit', function(e) {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        if (username === 'admin' && password === 'admin123') {
            alert('Đăng nhập thành công! Chuyển đến trang chủ...');
            window.location.href = '/';
        } else {
            alert('Sai tên đăng nhập hoặc mật khẩu!');
        }
    });
</script>
</body>
</html>
