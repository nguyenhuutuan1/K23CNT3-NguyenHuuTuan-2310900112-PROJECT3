<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Chi tiết hóa đơn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 th:text="${title}">Chi tiết hóa đơn</h2>

    <div class="card mb-4">
        <div class="card-header">
            <h5>Thông tin hóa đơn</h5>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-3"><strong>Mã HD:</strong> <span th:text="${hoadon.maHD}"></span></div>
                <div class="col-md-3"><strong>Ngày lập:</strong> <span th:text="${hoadon.ngayLapHD}"></span></div>
                <div class="col-md-3"><strong>Khách hàng:</strong> <span th:text="${hoadon.khachHang.hoTen}"></span></div>
                <div class="col-md-3"><strong>Nhân viên:</strong> <span th:text="${hoadon.nhanVien.hoTen}"></span></div>
            </div>
            <div class="row mt-2">
                <div class="col-md-6"><strong>Trạng thái:</strong> <span th:text="${hoadon.trangThai}" class="badge" th:class="${hoadon.trangThai == 'Đã thanh toán' ? 'bg-success' : hoadon.trangThai == 'Đang giao hàng' ? 'bg-warning' : 'bg-secondary'}"></span></div>
                <div class="col-md-6"><strong>Tổng tiền:</strong> <span th:text="${#numbers.formatCurrency(hoadon.tongTien)}" class="fw-bold text-success"></span></div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h5>Chi tiết sản phẩm</h5>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered">
                    <thead>
                    <tr><th>STT</th><th>Sản phẩm</th><th>Số lượng</th><th>Đơn giá</th><th>Thành tiền</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="ct, iter : ${hoadon.chiTietHoaDon}">
                        <td th:text="${iter.index + 1}"></td>
                        <td th:text="${ct.sanPham.tenSP}"></td>
                        <td th:text="${ct.soLuong}"></td>
                        <td th:text="${#numbers.formatCurrency(ct.donGia)}"></td>
                        <td th:text="${#numbers.formatCurrency(ct.thanhTien)}" class="fw-bold"></td>
                    </tr>
                    <tr>
                        <td colspan="4" class="text-end"><strong>TỔNG CỘNG:</strong></td>
                        <td class="fw-bold text-success" th:text="${#numbers.formatCurrency(hoadon.tongTien)}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="mt-3">
        <a href="/hoadon" class="btn btn-secondary">Quay lại danh sách</a>
    </div>
</div>
</body>
</html>
