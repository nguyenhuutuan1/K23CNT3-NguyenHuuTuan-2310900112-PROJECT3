<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Tạo hóa đơn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 th:text="${title}">Tạo hóa đơn mới</h2>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/hoadon/save}" th:object="${hoadon}" method="post">
                <div class="row mb-4">
                    <div class="col-md-4">
                        <label class="form-label">Khách hàng</label>
                        <select th:field="*{khachHang}" class="form-select">
                            <option value="">-- Chọn khách hàng --</option>
                            <option th:each="kh : ${khachhangList}" th:value="${kh.maKH}" th:text="${kh.hoTen}"></option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Nhân viên</label>
                        <select th:field="*{nhanVien}" class="form-select">
                            <option value="">-- Chọn nhân viên --</option>
                            <option th:each="nv : ${nhanvienList}" th:value="${nv.maNV}" th:text="${nv.hoTen}"></option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Ngày lập hóa đơn</label>
                        <input type="date" th:field="*{ngayLapHD}" class="form-control" required>
                    </div>
                </div>

                <h4 class="mb-3">Danh sách sản phẩm</h4>
                <div class="table-responsive mb-4">
                    <table class="table table-bordered">
                        <thead class="table-light">
                        <tr><th>Sản phẩm</th><th>Số lượng</th><th>Đơn giá</th><th>Thành tiền</th><th>Thao tác</th></tr>
                        </thead>
                        <tbody id="product-list">
                        <!-- Sẽ được thêm bằng JavaScript -->
                        </tbody>
                    </table>
                </div>

                <div class="mb-4">
                    <div class="row">
                        <div class="col-md-8">
                            <select id="product-select" class="form-select">
                                <option value="">-- Chọn sản phẩm --</option>
                                <option th:each="sp : ${sanphamList}" th:value="${sp.maSP}" th:text="${sp.tenSP + ' - Còn: ' + sp.soLuong + ' ' + sp.donViTinh}"></option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <input type="number" id="quantity-input" class="form-control" placeholder="Số lượng" min="1" value="1">
                        </div>
                        <div class="col-md-2">
                            <button type="button" class="btn btn-primary w-100" onclick="addProduct()">Thêm</button>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="/hoadon" class="btn btn-secondary">Quay lại</a>
                    <button type="submit" class="btn btn-success">Tạo hóa đơn</button>
                </div>

                <!-- Hidden fields để lưu sản phẩm -->
                <div id="hidden-fields"></div>
            </form>
        </div>
    </div>
</div>

<script>
    let productCount = 0;
    const products = [];

    function addProduct() {
        const select = document.getElementById('product-select');
        const quantityInput = document.getElementById('quantity-input');

        if (!select.value || !quantityInput.value || quantityInput.value <= 0) {
            alert('Vui lòng chọn sản phẩm và nhập số lượng hợp lệ');
            return;
        }

        const productId = select.value;
        const productName = select.options[select.selectedIndex].text.split(' - ')[0];
        const quantity = parseInt(quantityInput.value);

        // Kiểm tra trùng
        if (products.some(p => p.id === productId)) {
            alert('Sản phẩm đã được thêm vào danh sách');
            return;
        }

        products.push({
            id: productId,
            name: productName,
            quantity: quantity
        });

        updateProductList();
        select.value = '';
        quantityInput.value = 1;
    }

    function updateProductList() {
        const tbody = document.getElementById('product-list');
        const hiddenFields = document.getElementById('hidden-fields');

        tbody.innerHTML = '';
        hiddenFields.innerHTML = '';

        products.forEach((product, index) => {
            // Thêm vào bảng hiển thị
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${product.name}</td>
                <td>${product.quantity}</td>
                <td>--</td>
                <td>--</td>
                <td><button type="button" class="btn btn-sm btn-danger" onclick="removeProduct(${index})">Xóa</button></td>
            `;
            tbody.appendChild(row);

            // Thêm hidden fields
            const idInput = document.createElement('input');
            idInput.type = 'hidden';
            idInput.name = 'sanphamIds';
            idInput.value = product.id;
            hiddenFields.appendChild(idInput);

            const qtyInput = document.createElement('input');
            qtyInput.type = 'hidden';
            qtyInput.name = 'quantities';
            qtyInput.value = product.quantity;
            hiddenFields.appendChild(qtyInput);
        });
    }

    function removeProduct(index) {
        products.splice(index, 1);
        updateProductList();
    }
</script>
</body>
</html>
