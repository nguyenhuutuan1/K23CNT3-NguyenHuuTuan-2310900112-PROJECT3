<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Danh sách hóa đơn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 th:text="${title}">Danh sách hóa đơn</h2>
        <a href="/hoadon/create" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Tạo hóa đơn mới</a>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>Mã HD</th><th>Ngày lập</th><th>Khách hàng</th><th>Nhân viên</th><th>Tổng tiền</th><th>Trạng thái</th><th>Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="hd : ${hoadonList}">
                        <td th:text="${hd.maHD}"></td>
                        <td th:text="${hd.ngayLapHD}"></td>
                        <td th:text="${hd.khachHang.hoTen}"></td>
                        <td th:text="${hd.nhanVien.hoTen}"></td>
                        <td th:text="${#numbers.formatCurrency(hd.tongTien)}"></td>
                        <td>
                            <span th:class="${hd.trangThai == 'Đã thanh toán' ? 'badge bg-success' : hd.trangThai == 'Đang giao hàng' ? 'badge bg-warning' : 'badge bg-secondary'}" th:text="${hd.trangThai}"></span>
                        </td>
                        <td>
                            <a th:href="@{/hoadon/{id}(id=${hd.maHD})}" class="btn btn-sm btn-info"><i class="bi bi-eye"></i></a>
                            <a th:href="@{/hoadon/delete/{id}(id=${hd.maHD})}" class="btn btn-sm btn-danger" onclick="return confirm('Xóa hóa đơn này?')"><i class="bi bi-trash"></i></a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
