<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Danh sách nhân viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 th:text="${title}">Danh sách nhân viên</h2>
        <a href="/nhanvien/add" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Thêm nhân viên</a>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>Mã NV</th><th>Họ tên</th><th>Chức vụ</th><th>Lương</th><th>Điện thoại</th><th>Email</th><th>Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="nv : ${nhanvienList}">
                        <td th:text="${nv.maNV}"></td>
                        <td th:text="${nv.hoTen}"></td>
                        <td th:text="${nv.chucVu}"></td>
                        <td th:text="${#numbers.formatCurrency(nv.luong)}"></td>
                        <td th:text="${nv.dienThoai}"></td>
                        <td th:text="${nv.email}"></td>
                        <td>
                            <a th:href="@{/nhanvien/{id}(id=${nv.maNV})}" class="btn btn-sm btn-info"><i class="bi bi-eye"></i></a>
                            <a th:href="@{/nhanvien/edit/{id}(id=${nv.maNV})}" class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></a>
                            <a th:href="@{/nhanvien/delete/{id}(id=${nv.maNV})}" class="btn btn-sm btn-danger" onclick="return confirm('Xóa nhân viên này?')"><i class="bi bi-trash"></i></a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
