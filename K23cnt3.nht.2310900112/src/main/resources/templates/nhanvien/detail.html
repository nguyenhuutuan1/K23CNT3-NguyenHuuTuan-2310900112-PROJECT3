<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Chi tiết nhân viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 th:text="${title}">Chi tiết nhân viên</h2>

    <div class="card">
        <div class="card-body">
            <div class="row">
                <div class="col-md-8">
                    <h4 th:text="${nhanvien.hoTen}">Họ tên nhân viên</h4>

                    <table class="table table-borderless">
                        <tr>
                            <th width="150">Mã NV:</th>
                            <td th:text="${nhanvien.maNV}"></td>
                        </tr>
                        <tr>
                            <th>Ngày sinh:</th>
                            <td th:text="${nhanvien.ngaySinh}"></td>
                        </tr>
                        <tr>
                            <th>Giới tính:</th>
                            <td th:text="${nhanvien.gioiTinh}"></td>
                        </tr>
                        <tr>
                            <th>Chức vụ:</th>
                            <td th:text="${nhanvien.chucVu}" class="fw-bold"></td>
                        </tr>
                        <tr>
                            <th>Lương:</th>
                            <td th:text="${#numbers.formatCurrency(nhanvien.luong)}" class="text-success fw-bold"></td>
                        </tr>
                        <tr>
                            <th>Địa chỉ:</th>
                            <td th:text="${nhanvien.diaChi}"></td>
                        </tr>
                        <tr>
                            <th>Điện thoại:</th>
                            <td th:text="${nhanvien.dienThoai}"></td>
                        </tr>
                        <tr>
                            <th>Email:</th>
                            <td th:text="${nhanvien.email}"></td>
                        </tr>
                    </table>
                </div>

                <div class="col-md-4">
                    <div class="card">
                        <div class="card-header bg-light">
                            <h6 class="mb-0">Thao tác</h6>
                        </div>
                        <div class="card-body">
                            <div class="d-grid gap-2">
                                <a th:href="@{/nhanvien/edit/{id}(id=${nhanvien.maNV})}" class="btn btn-warning">
                                    <i class="bi bi-pencil"></i> Chỉnh sửa
                                </a>
                                <a th:href="@{/hoadon}" class="btn btn-info">
                                    <i class="bi bi-receipt"></i> Xem hóa đơn
                                </a>
                                <a href="/nhanvien" class="btn btn-secondary">
                                    <i class="bi bi-arrow-left"></i> Quay lại
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
