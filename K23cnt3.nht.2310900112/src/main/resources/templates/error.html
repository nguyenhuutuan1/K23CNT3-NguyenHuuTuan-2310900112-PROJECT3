<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${errorTitle} ?: 'Lỗi Ứng dụng'">Lỗi Ứng dụng</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .error-container {
            margin-top: 100px;
            text-align: center;
        }
        .error-code {
            font-size: 120px;
            font-weight: bold;
            color: #dc3545;
        }
        .error-message {
            font-size: 24px;
            margin: 20px 0;
        }
        .back-button {
            margin-top: 30px;
            padding: 10px 30px;
            font-size: 18px;
        }
        .error-details {
            margin-top: 30px;
            text-align: left;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="error-container">
        <div class="error-code" th:text="${statusCode} ?: '500'">500</div>
        <h1 class="error-message" th:text="${errorTitle} ?: 'Lỗi Ứng dụng'">Lỗi Ứng dụng</h1>
        <p th:text="${errorMessage} ?: 'Đã xảy ra lỗi không xác định'">Đã xảy ra lỗi không xác định</p>

        <div class="error-details card" th:if="${statusCode} != 404">
            <div class="card-header bg-light">
                <h5 class="mb-0">Thông tin chi tiết</h5>
            </div>
            <div class="card-body">
                <p><strong>Mã lỗi:</strong> <span th:text="${statusCode}">N/A</span></p>
                <p><strong>Mô tả:</strong> <span th:text="${statusText}">N/A</span></p>
                <p><strong>Loại exception:</strong> <span th:text="${exceptionType}">N/A</span></p>
                <p><strong>URL yêu cầu:</strong> <span th:text="${requestUri}">N/A</span></p>
                <p><strong>Thời gian:</strong> <span th:text="${#dates.format(#dates.createNow(), 'dd/MM/yyyy HH:mm:ss')}"></span></p>
            </div>
        </div>

        <div class="mt-4">
            <a th:href="@{/}" class="btn btn-primary back-button">
                <i class="bi bi-house-door"></i> Về trang chủ
            </a>
            <button onclick="history.back()" class="btn btn-secondary back-button ms-2">
                <i class="bi bi-arrow-left"></i> Quay lại
            </button>
        </div>
    </div>
</div>

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
