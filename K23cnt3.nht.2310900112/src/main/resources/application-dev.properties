# ==========================================
# SPRING BOOT CONFIGURATION - GROCERY STORE
# ==========================================

# ==========================================
# 1. SERVER CONFIGURATION
# ==========================================
server.port=8080
server.servlet.context-path=/taphoa
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.error.include-stacktrace=never
server.error.include-message=always
server.compression.enabled=true

# ==========================================
# 2. DATABASE CONFIGURATION (MySQL)
# ==========================================
# Database connection
spring.datasource.url=jdbc:mysql://localhost:3306/taphoa_nht?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=22446688
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ==========================================
# 3. JPA / HIBERNATE CONFIGURATION
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# ==========================================
# 4. THYMELEAF TEMPLATE CONFIGURATION
# ==========================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=true
spring.thymeleaf.enabled=true

# Enable Thymeleaf Layout Dialect
spring.thymeleaf.check-template=true

# ==========================================
# 5. FILE UPLOAD CONFIGURATION
# ==========================================
# Maximum file size (10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# File upload directory (relative to project)
file.upload-dir=uploads
file.product.upload-dir=${file.upload-dir}/products
file.avatar.upload-dir=${file.upload-dir}/avatars

# ==========================================
# 6. LOGGING CONFIGURATION
# ==========================================
logging.level.root=WARN
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=ERROR
logging.level.com.yourcompany.taphoa=DEBUG
logging.level.org.springframework.security=DEBUG

# Log file configuration
logging.file.name=logs/taphoa-app.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ==========================================
# 7. SECURITY CONFIGURATION (Basic)
# ==========================================
# Disable default security for now (will configure later)
spring.security.filter.dispatcher-types=REQUEST,ERROR,ASYNC

# ==========================================
# 8. INTERNATIONALIZATION (i18n)
# ==========================================
spring.mvc.locale=vi_VN
spring.mvc.locale-resolver=fixed
spring.web.locale=vi_VN
spring.web.locale-resolver=fixed

# ==========================================
# 9. CACHE CONFIGURATION
# ==========================================
spring.cache.type=simple
spring.cache.cache-names=products,categories,users
spring.cache.caffeine.spec=maximumSize=500,expireAfterAccess=600s

# ==========================================
# 10. EMAIL CONFIGURATION (for future use)
# ==========================================
# Uncomment when you need email service
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=your-email@gmail.com
# spring.mail.password=your-password
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# 11. APPLICATION SPECIFIC CONFIGURATIONS
# ==========================================
# Pagination
app.pagination.page-size.default=10
app.pagination.page-size.options=10,25,50,100

# File paths for static resources
app.resources.product-images=/uploads/products/
app.resources.avatar-images=/uploads/avatars/
app.resources.default-product-image=/images/default-product.png
app.resources.default-avatar-image=/images/default-avatar.png

# Order status configurations
app.order.status.pending=CHO_XU_LY
app.order.status.confirmed=DA_XAC_NHAN
app.order.status.shipping=DANG_GIAO
app.order.status.delivered=DA_GIAO
app.order.status.cancelled=DA_HUY

# Employee roles
app.employee.role.admin=QUAN_LY
app.employee.role.sales=NHAN_VIEN_BAN_HANG
app.employee.role.warehouse=NHAN_VIEN_KHO
app.employee.role.cashier=NHAN_VIEN_THU_NGAN
app.employee.role.delivery=NHAN_VIEN_GIAO_HANG

# Customer status
app.customer.status.active=HOAT_DONG
app.customer.status.inactive=KHOA
app.customer.status.unverified=CHUA_KICH_HOAT

# ==========================================
# 12. DEBUG/DEVELOPMENT SETTINGS
# ==========================================
# Set to true only in development
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.h2.console.enabled=false

# Show SQL parameters in logs (development only)
spring.jpa.properties.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ==========================================
# 13. PROFILE CONFIGURATION
# ==========================================
# Uncomment to activate specific profile
# spring.profiles.active=dev
# spring.profiles.active=prod

# ==========================================
# 14. VALIDATION CONFIGURATION
# ==========================================
spring.mvc.hiddenmethod.filter.enabled=true