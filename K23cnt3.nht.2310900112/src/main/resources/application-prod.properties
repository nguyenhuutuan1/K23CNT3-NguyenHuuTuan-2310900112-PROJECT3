# Database Production
spring.datasource.url=jdbc:mysql://production-server:3306/taphoa_nht_prod?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useSSL=true
spring.datasource.username=root
spring.datasource.password=22446688

# JPA Production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Thymeleaf Production
spring.thymeleaf.cache=true

# Server Production
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Logging Production
logging.level.root=WARN
logging.level.K23cnt3.nht._2=INFO
logging.file.name=/var/log/taphoa/app.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Security Production
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never