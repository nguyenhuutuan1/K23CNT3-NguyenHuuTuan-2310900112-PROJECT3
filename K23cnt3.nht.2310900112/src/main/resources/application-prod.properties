# ==========================================
# PRODUCTION PROFILE CONFIGURATION
# ==========================================
# Production environment settings
spring.profiles.active=prod

# ==========================================
# 1. DATABASE CONFIGURATION - PRODUCTION
# ==========================================
# Production database (use environment variables for security)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/taphoa_nht?useSSL=true&requireSSL=true&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
spring.datasource.username=root
spring.datasource.password=22446688
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool - optimized for production
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.pool-name=TapHoaProdPool
spring.datasource.hikari.auto-commit=false

# Database performance tuning
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true
spring.datasource.hikari.data-source-properties.useLocalSessionState=true
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true
spring.datasource.hikari.data-source-properties.cacheResultSetMetadata=true
spring.datasource.hikari.data-source-properties.cacheServerConfiguration=true
spring.datasource.hikari.data-source-properties.elideSetAutoCommits=true
spring.datasource.hikari.data-source-properties.maintainTimeStats=false

# ==========================================
# 2. JPA / HIBERNATE - PRODUCTION SETTINGS
# ==========================================
# Never auto-create schema in production
spring.jpa.hibernate.ddl-auto=validate

# Disable SQL logging in production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false

# Optimize for production
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

# Disable open session in view
spring.jpa.open-in-view=false

# ==========================================
# 3. THYMELEAF - PRODUCTION SETTINGS
# ==========================================
# Enable template caching for performance
spring.thymeleaf.cache=true
spring.thymeleaf.check-template=false

# Template configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Cache TTL for templates (24 hours)
spring.thymeleaf.cache.ttlms=86400000

# ==========================================
# 4. LOGGING - PRODUCTION SETTINGS
# ==========================================
# Production logging levels (less verbose)
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=ERROR
logging.level.org.apache=ERROR
logging.level.com.zaxxer.hikari=INFO

# Application logging
logging.level.K23cnt3.nht.2310900112=INFO
logging.level.com.taphoa=INFO

# Log file configuration
logging.file.name=/var/log/taphoa/taphoa-app.log
logging.file.max-size=100MB
logging.file.max-history=30
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Logback rolling policy
logging.logback.rollingpolicy.max-file-size=100MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=3GB

# Security logging
logging.level.org.springframework.security=WARN

# ==========================================
# 5. FILE UPLOAD - PRODUCTION
# ==========================================
# Reasonable file size limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Production upload directory (outside application)
file.upload-dir=/var/taphoa/uploads
file.product.upload-dir=${file.upload-dir}/products
file.avatar.upload-dir=${file.upload-dir}/avatars

# Ensure directory exists
spring.servlet.multipart.location=${file.upload-dir}

# File permissions (Linux)
file.upload.permissions=rwxr-xr-x

# ==========================================
# 6. SERVER CONFIGURATION - PRODUCTION
# ==========================================
# Standard HTTP port
server.port=8080

# Use behind proxy (nginx/apache)
server.forward-headers-strategy=framework
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.tomcat.use-relative-redirects=true

# Session configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# Security headers
server.servlet.session.cookie.name=__Secure-TAPHOASESSION
server.servlet.session.tracking-modes=cookie

# Error handling
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=on_param
server.error.path=/error
server.error.whitelabel.enabled=false

# Compression for performance
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=2048

# Tomcat optimization
server.tomcat.max-connections=10000
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=20
server.tomcat.accept-count=100
server.tomcat.connection-timeout=5000
server.tomcat.keep-alive-timeout=30000

# ==========================================
# 7. SECURITY - PRODUCTION
# ==========================================
# CORS configuration (restrict to your domain)
spring.web.cors.allowed-origins=https://yourdomain.com,https://www.yourdomain.com
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# CSRF protection
spring.security.filter.dispatcher-types=REQUEST,ERROR,ASYNC

# Content Security Policy (to be configured with Spring Security)
# security.headers.content-security-policy=default-src 'self'

# ==========================================
# 8. CACHE - PRODUCTION OPTIMIZATION
# ==========================================
# Enable caching
spring.cache.type=caffeine
spring.cache.cache-names=products,categories,customers,orders
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=3600s,recordStats

# HTTP caching
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.no-cache=false
spring.web.resources.cache.cachecontrol.must-revalidate=true
spring.web.resources.cache.cachecontrol.proxy-revalidate=true

# Static resources cache
spring.web.resources.chain.enabled=true
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

# ==========================================
# 9. EMAIL - PRODUCTION
# ==========================================
# Real email service
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email templates
app.email.from=noreply@taphoa.com
app.email.support=support@taphoa.com
app.email.admin=admin@taphoa.com

# ==========================================
# 10. MONITORING AND MANAGEMENT
# ==========================================
# Actuator endpoints (secured)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.web.base-path=/manage
management.endpoints.web.path-mapping.health=status
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Health checks
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.health.diskspace.path=/var/taphoa
management.health.diskspace.threshold=10GB

# Metrics
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.enable.jvm=true
management.metrics.enable.logback=true
management.metrics.enable.processor=true

# ==========================================
# 11. APPLICATION SPECIFIC - PRODUCTION
# ==========================================
# Pagination
app.pagination.page-size.default=20
app.pagination.page-size.options=10,20,50,100

# Order processing
app.order.auto-cancel-hours=24
app.order.max-items-per-order=50
app.order.min-amount=10000

# Payment gateway (real)
app.payment.gateway.test-mode=false
app.payment.gateway.url=${PAYMENT_GATEWAY_URL:https://api.paymentgateway.com}
app.payment.gateway.key=${PAYMENT_GATEWAY_KEY:}
app.payment.gateway.secret=${PAYMENT_GATEWAY_SECRET:}

# SMS service (real)
app.sms.provider.test-mode=false
app.sms.provider.url=${SMS_PROVIDER_URL:https://api.smsprovider.com}
app.sms.provider.key=${SMS_PROVIDER_KEY:}
app.sms.provider.secret=${SMS_PROVIDER_SECRET:}

# External APIs
app.api.google-maps.key=${GOOGLE_MAPS_API_KEY:}
app.api.recaptcha.key=${RECAPTCHA_SITE_KEY:}
app.api.recaptcha.secret=${RECAPTCHA_SECRET_KEY:}

# Security keys (use environment variables)
app.security.jwt.secret=${JWT_SECRET:}
app.security.encryption.key=${ENCRYPTION_KEY:}

# ==========================================
# 12. PERFORMANCE AND SCALING
# ==========================================
# Async processing
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=taphoa-async-

# Scheduled tasks
spring.task.scheduling.pool.size=5
spring.task.scheduling.thread-name-prefix=taphoa-scheduler-

# Database connection validation
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000

# ==========================================
# 13. ERROR HANDLING AND RESILIENCE
# ==========================================
# Circuit breaker (if using Resilience4j)
# resilience4j.circuitbreaker.instances.backend.failure-rate-threshold=50
# resilience4j.circuitbreaker.instances.backend.wait-duration-in-open-state=10s

# Retry configuration
spring.retry.max-attempts=3

# Timeouts
spring.mvc.async.request-timeout=30000

# ==========================================
# 14. COMPLIANCE AND AUDITING
# ==========================================
# Log sensitive operations
app.audit.log-login=true
app.audit.log-order-changes=true
app.audit.log-price-changes=true
app.audit.log-user-changes=true

# Data retention
app.data.retention.days.logs=90
app.data.retention.days.audit=365
app.data.retention.days.backup=30

# ==========================================
# 15. DEPLOYMENT SPECIFIC
# ==========================================
# Profile-specific banner
spring.banner.location=classpath:banner-prod.txt

# Disable devtools in production
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Shutdown gracefully
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Application version
app.version=1.0.0
app.build.number=${BUILD_NUMBER:unknown}
app.deployment.env=production