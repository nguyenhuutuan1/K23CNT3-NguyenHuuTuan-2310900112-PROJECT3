<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{layout/header :: head}"></div>
<div th:replace="~{layout/header :: body}"></div>

<div class="container my-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/}">Trang chủ</a></li>
            <li class="breadcrumb-item"><a th:href="@{/sanpham}">Sản phẩm</a></li>
            <li class="breadcrumb-item"><a th:href="@{/sanpham/danhmuc/{id}(id=${sanPham.danhMuc.id})}"
                                           th:text="${sanPham.danhMuc.tenDanhMuc}">Danh mục</a></li>
            <li class="breadcrumb-item active" th:text="${sanPham.tenSanPham}">Sản phẩm</li>
        </ol>
    </nav>

    <div class="row">
        <div class="col-md-6">
            <div class="card">
                <img th:src="${sanPham.hinhAnh != null ? sanPham.hinhAnh : 'https://via.placeholder.com/500x400/f8f9fa/6c757d?text=' + sanPham.tenSanPham}"
                     class="card-img-top" th:alt="${sanPham.tenSanPham}">
            </div>
        </div>

        <div class="col-md-6">
            <h2 th:text="${sanPham.tenSanPham}">Tên sản phẩm</h2>
            <hr>

            <div class="mb-3">
                <span class="badge bg-primary" th:text="${sanPham.danhMuc.tenDanhMuc}">Danh mục</span>
                <span class="badge bg-success" th:if="${sanPham.soLuongTon > 0}">
                    <i class="fas fa-check"></i> Còn hàng
                </span>
                <span class="badge bg-danger" th:if="${sanPham.soLuongTon <= 0}">
                    <i class="fas fa-times"></i> Hết hàng
                </span>
            </div>

            <h3 class="text-danger fw-bold mb-3">
                <span th:text="${#numbers.formatDecimal(sanPham.gia, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">Giá</span>
            </h3>

            <div class="mb-3">
                <p><strong><i class="fas fa-box"></i> Số lượng tồn kho:</strong>
                    <span th:text="${sanPham.soLuongTon}">0</span>
                </p>
            </div>

            <div class="mb-4" th:if="${sanPham.moTa != null}">
                <h5><i class="fas fa-info-circle"></i> Mô tả sản phẩm</h5>
                <p th:text="${sanPham.moTa}">Mô tả</p>
            </div>

            <form th:action="@{/giohang/add}" method="post" th:if="${sanPham.soLuongTon > 0}">
                <input type="hidden" name="sanPhamId" th:value="${sanPham.id}">
                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <label class="form-label"><strong>Số lượng:</strong></label>
                        <input type="number" class="form-control" name="soLuong" value="1" min="1"
                               th:max="${sanPham.soLuongTon}" required>
                    </div>
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="fas fa-cart-plus"></i> Thêm vào giỏ hàng
                    </button>
                    <a th:href="@{/sanpham}" class="btn btn-outline-secondary">
                        <i class="fas fa-arrow-left"></i> Tiếp tục mua sắm
                    </a>
                </div>
            </form>

            <div class="alert alert-warning" th:if="${sanPham.soLuongTon <= 0}">
                <i class="fas fa-exclamation-triangle"></i> Sản phẩm tạm thời hết hàng
            </div>
        </div>
    </div>

    <!-- Related Products -->
    <div class="mt-5" th:if="${sanPhamLienQuan != null && !sanPhamLienQuan.isEmpty()}">
        <h4 class="mb-3"><i class="fas fa-th"></i> Sản phẩm liên quan</h4>
        <div class="row g-3">
            <div class="col-md-3" th:each="sp : ${sanPhamLienQuan}">
                <div class="card h-100">
                    <a th:href="@{/sanpham/{id}(id=${sp.id})}">
                        <img th:src="${sp.hinhAnh != null ? sp.hinhAnh : 'https://via.placeholder.com/300x200/f8f9fa/6c757d?text=' + sp.tenSanPham}"
                             class="card-img-top" th:alt="${sp.tenSanPham}"
                             style="height: 150px; object-fit: cover;">
                    </a>
                    <div class="card-body">
                        <h6 class="card-title">
                            <a th:href="@{/sanpham/{id}(id=${sp.id})}"
                               class="text-decoration-none text-dark"
                               th:text="${sp.tenSanPham}">Tên sản phẩm</a>
                        </h6>
                        <p class="text-danger fw-bold"
                           th:text="${#numbers.formatDecimal(sp.gia, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">Giá</p>
                    </div>
                    <div class="card-footer bg-transparent border-0">
                        <a th:href="@{/sanpham/{id}(id=${sp.id})}" class="btn btn-outline-primary btn-sm w-100">
                            <i class="fas fa-eye"></i> Xem chi tiết
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
