<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${sanPham.id != null ? 'Sửa sản phẩm' : 'Thêm sản phẩm'}">Form sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .form-container {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .page-header {
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 3px solid #0d6efd;
        }
        .btn-group-custom {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="form-container">
        <!-- HEADER -->
        <div class="page-header">
            <h2 class="mb-0">
                <i class="bi bi-box-seam"></i>
                <span th:text="${sanPham.id != null ? 'Sửa sản phẩm' : 'Thêm sản phẩm mới'}">Sửa sản phẩm</span>
            </h2>
        </div>

        <!-- ALERT MESSAGES -->
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <strong>Lỗi!</strong> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- FORM -->
        <form th:action="@{${sanPham.id != null ? '/admin/sanpham/' + sanPham.id + '/edit' : '/admin/sanpham/create'}}"
              method="post"
              th:object="${sanPham}">

            <!-- ID ẨN (chỉ khi sửa) -->
            <input type="hidden" th:if="${sanPham.id != null}" th:field="*{id}">

            <!-- TÊN SẢN PHẨM -->
            <div class="mb-3">
                <label for="tenSanPham" class="form-label fw-bold">
                    Tên sản phẩm <span class="text-danger">*</span>
                </label>
                <input type="text"
                       class="form-control form-control-lg"
                       id="tenSanPham"
                       th:field="*{tenSanPham}"
                       placeholder="VD: Coca Cola 330ml"
                       required>
            </div>

            <!-- MÔ TẢ -->
            <div class="mb-3">
                <label for="moTa" class="form-label fw-bold">Mô tả</label>
                <textarea class="form-control"
                          id="moTa"
                          th:field="*{moTa}"
                          rows="3"
                          placeholder="Mô tả chi tiết về sản phẩm..."></textarea>
            </div>

            <!-- GIÁ & SỐ LƯỢNG TỒN -->
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="gia" class="form-label fw-bold">
                        Giá (VNĐ) <span class="text-danger">*</span>
                    </label>
                    <input type="number"
                           class="form-control form-control-lg"
                           id="gia"
                           th:field="*{gia}"
                           step="1000"
                           min="0"
                           placeholder="10000"
                           required>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="soLuongTon" class="form-label fw-bold">
                        Số lượng tồn <span class="text-danger">*</span>
                    </label>
                    <input type="number"
                           class="form-control form-control-lg"
                           id="soLuongTon"
                           th:field="*{soLuongTon}"
                           min="0"
                           placeholder="100"
                           required>
                </div>
            </div>

            <!-- DANH MỤC & TRẠNG THÁI -->
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="danhMucId" class="form-label fw-bold">
                        Danh mục <span class="text-danger">*</span>
                    </label>
                    <select class="form-select form-select-lg"
                            id="danhMucId"
                            name="danhMucId"
                            required>
                        <option value="">-- Chọn danh mục --</option>
                        <option th:each="dm : ${danhMucs}"
                                th:value="${dm.id}"
                                th:text="${dm.tenDanhMuc}"
                                th:selected="${sanPham.danhMuc != null && sanPham.danhMuc.id == dm.id}">
                        </option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="trangThai" class="form-label fw-bold">Trạng thái</label>
                    <select class="form-select form-select-lg"
                            id="trangThai"
                            th:field="*{trangThai}">
                        <option value="AVAILABLE">Có sẵn</option>
                        <option value="OUT_OF_STOCK">Hết hàng</option>
                        <option value="DISCONTINUED">Ngừng kinh doanh</option>
                    </select>
                </div>
            </div>

            <!-- HÌNH ẢNH -->
            <div class="mb-3">
                <label for="hinhAnh" class="form-label fw-bold">Đường dẫn hình ảnh</label>
                <input type="text"
                       class="form-control"
                       id="hinhAnh"
                       th:field="*{hinhAnh}"
                       placeholder="/images/products/coca.jpg">
                <small class="text-muted">VD: /images/products/ten-san-pham.jpg</small>
            </div>

            <!-- BUTTONS -->
            <div class="btn-group-custom">
                <a th:href="@{/admin/sanpham}" class="btn btn-secondary btn-lg">
                    <i class="bi bi-x-circle"></i> Hủy
                </a>
                <button type="submit" class="btn btn-primary btn-lg">
                    <i class="bi bi-check-circle"></i>
                    <span th:text="${sanPham.id != null ? 'Cập nhật' : 'Thêm mới'}">Lưu</span>
                </button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
